<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QA Audit Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="preconnect" href="https://script.google.com"><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Baloo+Da+2:wght@600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--ink:#241a4d;--mute:#7a7399;--card:rgba(255,255,255,.82);--line:#ece7fb;--c1:#ff4fa3;--c2:#7c4dff;--c3:#00b8f0;--c4:#1fd6a0;--c5:#ffb02e}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Hind Siliguri',sans-serif;font-size:12.5px;color:var(--ink);min-height:100vh;
 background:radial-gradient(900px 500px at 5% -10%,#ffd3ea 0,transparent 60%),radial-gradient(800px 500px at 100% 0,#cfe9ff 0,transparent 60%),radial-gradient(900px 600px at 50% 110%,#d8ffe9 0,transparent 60%),#f6f2ff;
 background-attachment:fixed}
.wrap{max-width:1500px;margin:0 auto;padding:14px 14px 50px;position:relative}

/* ---- ভাসমান ব্যাকগ্রাউন্ড ---- */
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.42;z-index:-1;animation:float 18s ease-in-out infinite;pointer-events:none}
.bl1{width:340px;height:340px;background:#ff9ccf;left:-90px;top:8%}
.bl2{width:380px;height:380px;background:#9ad7ff;right:-110px;top:34%;animation-delay:-6s}
.bl3{width:320px;height:320px;background:#9bf3cf;left:38%;bottom:-130px;animation-delay:-11s}
@keyframes float{50%{transform:translate(44px,-54px) scale(1.14)}}

/* ---- হেডার + লোগো ---- */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px;animation:drop .7s cubic-bezier(.2,1.2,.4,1) both}
@keyframes drop{from{opacity:0;transform:translateY(-22px)}}
.logo{background:#fff;border-radius:14px;padding:5px 12px;box-shadow:0 6px 20px rgba(124,77,255,.16);display:flex;align-items:center;min-height:50px;transition:transform .3s}
.logo:hover{transform:scale(1.04) rotate(-1deg)}
.logo img{height:44px;display:block}
.lg{display:flex;flex-direction:column;line-height:1}
.lg .r1{font-family:'Baloo Da 2',sans-serif;font-weight:800;font-size:26px;font-style:italic;letter-spacing:-.5px}
.lg .a{color:#1d4fd8}.lg .b{color:#e3121e}
.lg small{font-size:10.5px;font-weight:700;color:#222;margin-top:2px}
h1{font-family:'Baloo Da 2','Hind Siliguri',sans-serif;font-size:24px;margin:0;line-height:1;
 background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3),var(--c4),var(--c1));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s linear infinite}
@keyframes shine{to{background-position:300% 0}}
.live{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mute);background:var(--card);padding:4px 10px;border-radius:99px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--c4);box-shadow:0 0 0 0 rgba(31,214,160,.6);animation:pulse 1.8s infinite}
.live.off i{background:#ff6b6b;animation:none}
.live.plain i{display:none}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(31,214,160,0)}100%{box-shadow:0 0 0 0 rgba(31,214,160,0)}}

/* ---- নেভিগেশন ---- */
.navw{position:relative;display:flex;gap:4px;background:var(--card);padding:5px;border-radius:16px;box-shadow:0 6px 20px rgba(124,77,255,.12);overflow-x:auto;margin-bottom:10px;backdrop-filter:blur(8px);scrollbar-width:none;animation:drop .7s .1s cubic-bezier(.2,1.2,.4,1) both}
.navw::-webkit-scrollbar{display:none}
.navw a{position:relative;z-index:1;display:flex;align-items:center;gap:6px;padding:8px 15px;border-radius:12px;text-decoration:none;color:var(--ink);font-weight:600;font-size:13px;white-space:nowrap;transition:color .25s,transform .2s}
.navw a:hover{transform:translateY(-2px)}
.navw a.on{color:#fff}
.nb{font-size:10.5px;background:rgba(124,77,255,.12);padding:1px 8px;border-radius:99px;font-weight:700}
.navw a.on .nb{background:rgba(255,255,255,.3)}
#pill{position:absolute;top:5px;bottom:5px;left:0;width:0;border-radius:12px;box-shadow:0 8px 18px rgba(124,77,255,.35);transition:left .5s cubic-bezier(.3,1.3,.5,1),width .5s cubic-bezier(.3,1.3,.5,1),background .4s}

.bar{display:flex;flex-wrap:wrap;gap:7px;align-items:center;background:var(--card);padding:8px 10px;border-radius:14px;box-shadow:0 6px 20px rgba(124,77,255,.12);backdrop-filter:blur(8px);animation:drop .7s .2s cubic-bezier(.2,1.2,.4,1) both}
body[data-page=home] .only-cat{display:none!important}
body[data-pg=outbound] #lockBtn,body[data-pg=outbound] #syncBtn,body[data-pg=outbound] #mode,body[data-pg=outbound] #month{display:none!important}
.note{padding:10px 4px;line-height:1.8;color:var(--ink)}
.note b{color:#e5195f}
select,input,button{font:inherit}
select,input[type=month],input[type=text],input[type=search]{padding:6px 10px;border-radius:9px;border:1.5px solid var(--line);background:#fff;color:var(--ink);outline:none;font-size:12.5px;transition:border-color .2s,box-shadow .2s}
select:focus,input:focus{border-color:var(--c2);box-shadow:0 0 0 3px rgba(124,77,255,.15)}
.btn{border:0;padding:7px 13px;border-radius:10px;color:#fff;font-weight:600;cursor:pointer;transition:transform .15s,box-shadow .2s;background-size:200% 100%;font-size:12.5px}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 14px rgba(0,0,0,.16);background-position:100% 0}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.6;cursor:wait}
.b-sync{background-image:linear-gradient(90deg,var(--c2),var(--c3),var(--c2))}
.b-new{background-image:linear-gradient(90deg,var(--c1),var(--c5),var(--c1))}
.b-link{background-image:linear-gradient(90deg,var(--c4),var(--c3),var(--c4))}
.b-ghost{background:#efeaff;color:var(--c2)}
.b-del{background:linear-gradient(90deg,#ff5f6d,#ff8a5c)}
.sp{flex:1}

/* ---- এন্ট্রি অ্যানিমেশন ---- */
@keyframes rise{from{opacity:0;transform:translateY(20px) scale(.98)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes bob{50%{transform:translateY(-5px) rotate(-6deg)}}
.enter .rise{animation:rise .65s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0ms)}
.enter .stat{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.enter .stat:nth-child(2){animation-delay:60ms}.enter .stat:nth-child(3){animation-delay:120ms}.enter .stat:nth-child(4){animation-delay:180ms}.enter .stat:nth-child(5){animation-delay:240ms}.enter .stat:nth-child(6){animation-delay:300ms}
.enter .sec{animation:rise .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:.25s}
.enter tr.ag{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.35s + var(--d,0ms))}

.stats{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.stat{flex:1;min-width:130px;background:var(--card);border-radius:14px;padding:9px 14px;position:relative;overflow:hidden;box-shadow:0 4px 14px rgba(60,30,140,.07);transition:transform .25s,box-shadow .25s}
.stat:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgba(60,30,140,.14)}
.stat::before{content:'';position:absolute;inset:0 auto 0 0;width:5px;background:var(--g)}
.stat small{color:var(--mute);font-weight:600;font-size:11px}
.stat b{display:block;font-family:'Baloo Da 2',sans-serif;font-size:26px;line-height:1.1}
.stat.ring{display:flex;align-items:center;gap:10px;flex:1.2}
.ring svg{width:54px;height:54px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .bg{stroke:#ece6ff}
.ring .fg{stroke:url(#grad);stroke-dasharray:264;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}

/* ---- হোম পেজ ---- */
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:12px 0}
.kpi{position:relative;overflow:hidden;border-radius:18px;padding:14px 16px;color:#fff;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 10px 24px rgba(60,30,140,.18);transition:transform .25s}
.kpi:hover{transform:translateY(-4px) scale(1.02)}
.kpi::after{content:'';position:absolute;right:-30px;top:-34px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.18);animation:bob 5s ease-in-out infinite}
.kpi small{font-weight:600;opacity:.92;font-size:12.5px}
.kpi b{display:block;font-family:'Baloo Da 2',sans-serif;font-size:42px;line-height:1.05}
.kpi em{font-style:normal;font-size:11.5px;opacity:.96}
.rcard{display:flex;align-items:center;gap:12px;border-radius:18px;padding:12px 16px;background:var(--card);box-shadow:0 10px 24px rgba(60,30,140,.12)}
.rcard svg{width:70px;height:70px;transform:rotate(-90deg)}
.rcard circle{fill:none;stroke-width:9;stroke-linecap:round}
.rcard .bg{stroke:#ece6ff}
.rcard .fg{stroke:url(#grad);stroke-dasharray:264;transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1)}
.rcard small{color:var(--mute);font-weight:600}
.rcard b{display:block;font-family:'Baloo Da 2',sans-serif;font-size:28px;line-height:1.1}
.pn{background:var(--card);border-radius:16px;margin:14px 0;overflow:hidden;box-shadow:0 8px 24px rgba(60,30,140,.1)}
.pn-h{display:flex;align-items:center;gap:10px;padding:8px 14px;color:#fff;background:linear-gradient(90deg,var(--a),var(--b))}
.pn-h h2{margin:0;font-family:'Baloo Da 2',sans-serif;font-size:16px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;padding:12px}
.cardc{background:#fff;border-radius:14px;padding:10px 12px;box-shadow:0 3px 12px rgba(60,30,140,.07)}
.cardc h4{margin:0 0 6px;font-size:13px}
.cbox{position:relative;height:250px}
.ccs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;padding:12px}
a.cc{display:block;text-decoration:none;color:var(--ink);background:#fff;border-radius:16px;padding:12px 14px;border-top:5px solid var(--a);box-shadow:0 4px 14px rgba(60,30,140,.08);transition:transform .25s,box-shadow .25s}
a.cc:hover{transform:translateY(-5px);box-shadow:0 14px 28px rgba(60,30,140,.18)}
.cc-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.cc-h span{font-size:20px}.cc-h i{margin-left:auto;font-style:normal;color:var(--a);transition:transform .25s}
a.cc:hover .cc-h i{transform:translateX(5px)}
.cc-n{margin:6px 0 4px}
.cc-n b{font-family:'Baloo Da 2',sans-serif;font-size:34px;line-height:1;color:var(--a)}
.cc-n small{color:var(--mute);font-size:13px;margin-left:4px}
.cc .pb i{width:0;background:linear-gradient(90deg,var(--a),var(--b));transform-origin:left;animation:grow 1.2s cubic-bezier(.2,.8,.2,1) both}
.cc .pb{margin:0 0 8px}
.cc-f{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mute)}
.cc-f b{color:var(--ink)}
.spk{height:54px;margin-top:8px}
.cc-t{font-size:11.5px;color:var(--mute);margin-top:2px}
.cc-t b{color:var(--a);font-size:13px}
table.dt{table-layout:auto;width:100%;min-width:560px}
.dt th,.dt td{padding:6px 10px;height:auto}
.dt td.dl{text-align:left;font-weight:700}
.dt td.dl small{display:block;color:var(--mute);font-weight:400;font-size:10.5px}
.tg{display:inline-block;background:linear-gradient(90deg,var(--c1),var(--c5));color:#fff;font-size:10px;font-weight:700;padding:0 7px;border-radius:99px;vertical-align:middle}
.dt tr.yest .tg{background:linear-gradient(90deg,var(--c2),var(--c3))}
.dt tr.today td{background:#fff3cf}
.dt tr.yest td{background:#f1ecff}
.dt tr:not(.today):hover td{background:#faf7ff}
.mb{height:8px;border-radius:99px;background:linear-gradient(90deg,var(--c3),var(--c4));transform-origin:left;animation:grow 1.2s cubic-bezier(.2,.8,.2,1) both}
.mstack{display:flex;flex-direction:column;gap:12px;padding:12px}
.mt{float:right;font-weight:600;color:var(--mute)}.mt b{color:var(--c2);font-size:14px}
.pn-h .chip{margin-left:auto;background:rgba(255,255,255,.24);padding:2px 10px;border-radius:99px;font-weight:600;font-size:11.5px}
.warn{padding:16px;line-height:1.7;color:#b3261e}

/* ---- ক্যাটাগরি ব্যানার ---- */
.banner{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:18px;color:#fff;background:linear-gradient(110deg,var(--a),var(--b));box-shadow:0 12px 26px rgba(60,30,140,.2);margin:12px 0}
.banner .ico{font-size:36px;animation:bob 2.6s ease-in-out infinite}
.banner h2{margin:0;font-family:'Baloo Da 2',sans-serif;font-size:24px;line-height:1.1}
.banner small{opacity:.92;font-size:12px}

.sec{background:var(--card);border-radius:16px;margin:14px 0;overflow:hidden;box-shadow:0 8px 24px rgba(60,30,140,.1)}
.sec-h{display:flex;align-items:center;gap:10px;padding:8px 14px;color:#fff;background:linear-gradient(90deg,var(--a),var(--b))}
.sec-h h2{margin:0;font-family:'Baloo Da 2',sans-serif;font-size:16px}
.chip{background:rgba(255,255,255,.24);padding:2px 10px;border-radius:99px;font-weight:600;font-size:11.5px}
.sec-h .sp{flex:1}
.sec-h .btn{background:rgba(255,255,255,.95);color:var(--ink);padding:4px 11px;font-size:11.5px}
.scroll{overflow-x:auto}
table{border-collapse:separate;border-spacing:0;table-layout:fixed;max-width:none}
th,td{padding:3px 4px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid var(--line);height:30px}
thead th{font-size:10.5px;color:var(--mute);font-weight:600;background:#faf8ff;padding:5px}
thead tr.g th{font-size:10.5px;color:var(--c2);background:#f1ecff}
td.id,th.id{position:sticky;left:0;z-index:2;background:#fff;text-align:left;font-weight:600;font-size:11.5px;padding-left:10px}
td.nm,th.nm{position:sticky;left:100px;z-index:2;background:#fff;text-align:left;font-weight:600;box-shadow:6px 0 8px -6px rgba(60,30,140,.18)}
thead th.id,thead th.nm{background:#faf8ff;z-index:3}
tr.ag:hover td{background:#faf7ff}
tr.ag.done td{background:#effcf6}
tr.ag.done td.id,tr.ag.done td.nm{background:#effcf6}
td.dim{color:var(--mute);font-size:11.5px}
.g{display:inline-block;padding:1px 8px;border-radius:99px;font-size:10.5px;font-weight:600}
.g.m{background:#e3efff;color:#1e6bff}
.g.f{background:#ffe3f3;color:#e0398a}
.cb{width:16px;height:16px;border-radius:5px;border:2px solid var(--col);background:transparent;display:inline-grid;place-items:center;cursor:pointer;padding:0;transition:transform .15s,background .15s;position:relative;vertical-align:middle}
.cb:hover{transform:scale(1.25)}
.cb.on{background:var(--col)}
.cb.on::after{content:'';width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.cb.pop{animation:pop .4s ease}
.cb.auto{animation:glow 1.1s ease}
@keyframes pop{40%{transform:scale(1.6) rotate(8deg)}}
@keyframes glow{0%{box-shadow:0 0 0 0 var(--col)}100%{box-shadow:0 0 0 11px transparent}}
td.gap,th.gap{padding:0;background:#faf8ff}
.num{font-family:'Baloo Da 2',sans-serif;font-size:15px}
.left{color:#e0398a}
.ext{color:#e07a00}
.pb{height:6px;background:#ece6ff;border-radius:99px;overflow:hidden;margin:0 6px}
.pb i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--c3),var(--c4));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.act button{border:0;background:#f1ecff;border-radius:7px;width:24px;height:24px;cursor:pointer;font-size:12px;transition:transform .15s,background .15s}
.act button:hover{transform:scale(1.15);background:#e2d8ff}
.act .d:hover{background:#ffd9de}
.empty{padding:16px;color:var(--mute);text-align:center}
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,100px);background:var(--ink);color:#fff;padding:9px 18px;border-radius:12px;font-weight:600;z-index:60;transition:transform .35s cubic-bezier(.2,1.4,.4,1);max-width:92vw}
.toast.show{transform:translate(-50%,0)}
.loader{text-align:center;padding:50px;font-size:14px;font-weight:600}
.spin{width:36px;height:36px;margin:0 auto 10px;border-radius:50%;border:5px solid #ddd0ff;border-top-color:var(--c1);border-right-color:var(--c3);animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.modal{position:fixed;inset:0;background:rgba(36,26,77,.4);backdrop-filter:blur(4px);display:none;place-items:center;z-index:50}
.modal.show{display:grid}
.mbox{background:#fff;border-radius:18px;padding:18px 20px;width:min(380px,92vw);box-shadow:0 20px 60px rgba(60,30,140,.35);animation:mp .25s cubic-bezier(.2,1.3,.4,1)}
@keyframes mp{from{transform:scale(.88);opacity:0}}
.mbox h3{margin:0 0 12px;font-family:'Baloo Da 2',sans-serif;font-size:18px}
.mbox label{display:block;font-size:11px;font-weight:600;color:var(--mute);margin:8px 0 3px}
.mbox input,.mbox select{width:100%;padding:8px 10px;font-size:13px}
.mrow{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
td.id .cell,td.nm .cell{display:flex;align-items:center;gap:3px}
.cell .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.cp{border:0;background:transparent;cursor:pointer;opacity:.35;font-size:11px;padding:2px 4px;border-radius:6px;transition:opacity .15s,background .15s,transform .15s;line-height:1}
tr.ag:hover .cp{opacity:.8}
.cp:hover{opacity:1!important;background:#e9e1ff;transform:scale(1.15)}
.b-lock{background-image:linear-gradient(90deg,#ff5f6d,#ff9a5c,#ff5f6d);min-width:128px}
.b-lock.open{background-image:linear-gradient(90deg,#1fd6a0,#00b8f0,#1fd6a0)}
.b-lock.shake{animation:shake .5s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
#content.locked .cb{cursor:not-allowed}
#content.locked .cb:hover{transform:none}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:40;width:100%;height:100%}
button:focus-visible,.cb:focus-visible,a:focus-visible{outline:2px solid var(--c2);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- নতুন লোডার (% + অ্যানিমেশন) ---- */
.loader{display:flex;flex-direction:column;align-items:center;gap:10px;padding:44px 20px}
.ldr{position:relative;width:96px;height:96px;animation:lpulse 1.8s ease-in-out infinite}
.ldr svg{width:100%;height:100%;transform:rotate(-90deg)}
.ldr circle{fill:none;stroke-width:8;stroke-linecap:round}
.ldr .lb{stroke:#ece6ff}.ldr .lf{stroke:url(#lg);stroke-dasharray:264;stroke-dashoffset:264;transition:stroke-dashoffset .25s linear}
.ldr .lp{position:absolute;inset:0;display:grid;place-items:center;font-family:'Baloo Da 2',sans-serif;font-size:24px;color:var(--c2)}
.ldr::after{content:'';position:absolute;inset:-8px;border-radius:50%;border:3px solid transparent;border-top-color:var(--c1);border-right-color:var(--c3);animation:sp 1.1s linear infinite}
@keyframes lpulse{50%{transform:scale(1.05)}}
.ls{font-size:13px;font-weight:600;color:var(--mute)}
.lbar{width:180px;height:5px;border-radius:99px;background:#ece6ff;overflow:hidden}
.lbar i{display:block;height:100%;width:40%;border-radius:99px;background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3));animation:lslide 1.2s ease-in-out infinite}
@keyframes lslide{from{transform:translateX(-100%)}to{transform:translateX(450%)}}
/* ---- এজেন্টের গড় স্কোর ব্যাজ ---- */
.scw{flex:none;display:inline-flex}
.sc{min-width:36px;text-align:center;padding:0 7px;border-radius:99px;font-size:10.5px;font-weight:700;font-family:'Baloo Da 2',sans-serif;line-height:17px;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.14)}
.sc.s1{background:linear-gradient(90deg,#12c98a,#1fd6a0)}.sc.s2{background:linear-gradient(90deg,#00a6c7,#00b8f0)}
.sc.s3{background:linear-gradient(90deg,#ff9a1f,#ffb02e)}.sc.s4{background:linear-gradient(90deg,#ff5f6d,#ff8a5c)}

</style>
</head>
<body data-page="home">
<div class="blob bl1"></div><div class="blob bl2"></div><div class="blob bl3"></div>
<canvas id="fx"></canvas>
<div class="wrap">
  <div class="top">
    <div class="logo" id="logoBox"><img id="logoImg" src="gtpl_logo.png" alt="GTPL KCBPL – Digital Cable TV &amp; Broadband"></div>
    <h1>QA Audit Tracker</h1>
    <span class="live" id="live"><i></i><span id="liveTxt">লোড হচ্ছে…</span></span>
    <span class="live off" id="auto" title="ক্লিক করলে এখনই raw data মিলিয়ে টিক দেবে" style="cursor:pointer"><i></i><span id="autoTxt">Auto-tick…</span></span>
    <span class="live plain" id="dateChip"></span>
    <button class="btn b-lite" id="liteBtn"></button>
  </div>

  <nav class="navw" id="nav"><span id="pill"></span></nav>

  <div class="bar">
    <select id="sheetSel" aria-label="Sheet"></select>
    <input type="month" id="month" aria-label="Month">
    <select id="mode" aria-label="Sync mode">
      <option value="fill">Fill: বাকি টিক যোগ</option>
      <option value="exact">Exact: হুবহু মেলাও</option>
    </select>
    <button class="btn b-sync" id="syncBtn">⚡ Raw data থেকে অটো মার্ক</button>
    <button class="btn b-lock only-cat" id="lockBtn" title="টিক ম্যানুয়ালি বদলাতে আগে আনলক করুন">🔒 Locked</button>
    <input type="search" class="only-cat" id="q" placeholder="🔍 নাম / ID খুঁজুন" aria-label="Search">
    <span class="sp"></span>
    <button class="btn b-new" id="newBtn">➕ নতুন মাস</button>
    <button class="btn b-link" id="lnkBtn">🔗 Link</button>
    <button class="btn b-ghost" id="refBtn" title="রিফ্রেশ">⟳</button>
  </div>

  <div id="content"></div>
</div>

<div class="fab"><button id="goTop" title="Go to top">⬆ Go to top</button><button id="goBot" title="Go to bottom">⬇ Go to bottom</button></div>

<div class="modal" id="modal"><div class="mbox">
  <h3 id="mTitle"></h3>
  <div id="mBody"></div>
  <div class="mrow"><button class="btn b-ghost" id="mCancel">বাতিল</button><button class="btn b-sync" id="mOk">সেভ</button></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbzVZ2A42rIxh5UgpBPuHSlb2tJnwyp2eunQc3kcNeZ495bqUJTeMwT8ir6cMA_3HBHESw/exec';
const PER = 16, POLL_MS = 4000;                 // প্রতি 4 সেকেন্ডে Sheet দেখে, বদল থাকলে নিজে আপডেট
const PALETTE = ['#7c4dff','#e5195f','#1e6bff','#ff2fd0','#12a150','#ff8a00','#00a6c7','#9b27af'];

/* পেজ লিস্ট: re = Sheet-এর সেকশন নামের সাথে মেলানোর প্যাটার্ন, c = রং (গ্রেডিয়েন্ট) */
const PAGES = [
  {key:'home',     label:'Home',               ico:'🏠', c:['#7c4dff','#00b8f0']},
  {key:'catv',     label:'CATV',               ico:'📺', c:['#7c4dff','#00b8f0'], re:/catv|cable/i},
  {key:'bbtech',   label:'BB TECH',            ico:'🛠️', c:['#00a6c7','#12c98a'], re:/tech/i},
  {key:'bbrenew',  label:'BB RENEWAL',         ico:'🔄', c:['#ff4fa3','#ffb02e'], re:/renew/i},
  {key:'outbound', label:'Outbound Retention', ico:'📞', c:['#ff7a45','#e5195f'], re:/outbound|retention/i, manual:true}
];
const CATS = PAGES.slice(1);
const RAWCATS = CATS.filter(p => !p.manual);          // raw data থেকে আসা ক্যাটাগরি (Outbound বাদ: ওটা সবসময় ম্যানুয়াল)
const isManual = () => { const p = PAGES.find(x => x.key === PAGE); return !!(p && p.manual); };
let STATE = null, DASH = null, DASHM = null, dashmJson = '', dashJson = '', dashErr = '', current = '', busy = 0, lastJson = '', lastDone = 0, pollN = 0, PAGE = 'home';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const alpha = (hex, a) => hex + Math.round(a * 255).toString(16).padStart(2, '0');

/* ---------- লোডার (% সহ) ---------- */
let LP = 0, LT = null;
function loaderHtml(msg){
  return `<div class="loader"><div class="ldr"><svg viewBox="0 0 100 100"><defs><linearGradient id="lg"><stop offset="0" stop-color="#ff4fa3"/><stop offset=".5" stop-color="#7c4dff"/><stop offset="1" stop-color="#1fd6a0"/></linearGradient></defs><circle class="lb" cx="50" cy="50" r="42"/><circle class="lf" cx="50" cy="50" r="42" style="stroke-dashoffset:${264 * (1 - LP / 100)}"/></svg><b class="lp">${Math.round(LP)}%</b></div><div class="ls">${msg}</div><div class="lbar"><i></i></div></div>`;
}
function ldrTick(){
  document.querySelectorAll('.loader .lf').forEach(c => c.style.strokeDashoffset = 264 * (1 - LP / 100));
  document.querySelectorAll('.loader .lp').forEach(c => c.textContent = Math.round(LP) + '%');
}
function ldrStart(){ LP = 0; clearInterval(LT); LT = setInterval(() => { LP += (93 - LP) * .06; ldrTick(); }, 120); }
function ldrStop(){ clearInterval(LT); LT = null; LP = 100; ldrTick(); }

/* ---------- গড় স্কোর (কন্ডিশনাল ফরম্যাট: 90+ সবুজ · 80+ নীল · 70+ কমলা · নিচে লাল) ---------- */
let LITE = false, SCORES = null, scoresJson = '';
const SCORE_BANDS = [90, 80, 70];
const normN = s => String(s || '').toUpperCase().replace(/\s+/g, ' ').trim();
function paintScore(tr){
  const el = tr.querySelector('[data-score]'); if (!el || !STATE) return;
  const a = STATE.sections[+tr.dataset.s].agents[+tr.dataset.a];
  const e = SCORES && ((a.id && SCORES.byId[a.id.toUpperCase()]) || SCORES.byName[normN(a.name)]);
  if (!e){ el.innerHTML = ''; return; }
  const c = e.a >= SCORE_BANDS[0] ? 's1' : e.a >= SCORE_BANDS[1] ? 's2' : e.a >= SCORE_BANDS[2] ? 's3' : 's4';
  el.innerHTML = `<span class="sc ${c}" title="গড় স্কোর · ${e.n}টি অডিট">${e.a}</span>`;
}
function paintScores(){ document.querySelectorAll('tr.ag').forEach(paintScore); }
async function loadScores(){
  const for_ = current;
  try{
    const s = await run('getScores', current); if (for_ !== current) return;
    const j = JSON.stringify(s); if (j !== scoresJson){ scoresJson = j; SCORES = s; paintScores(); }
  }catch(e){}
}
/* ---------- প্রগ্রেস বারের রং: কম → বেশি ---------- */
const PBC = [['#ff4d5e','#ff7a6b'], ['#ff7a45','#ffa24d'], ['#ffc83d','#ffe066'], ['#8be04e','#4cd964'], ['#00c9a7','#00b8f0']];
const pbColor = r => PBC[r >= 1 ? 4 : r > .75 ? 3 : r > .5 ? 2 : r > .25 ? 1 : 0];

/* ---------- ক্যাশ: আগের ডাটা সাথে সাথে দেখায়, পেছনে নতুন ডাটা আনে ---------- */
const readBoot = () => { try{ return JSON.parse(localStorage.getItem('qa_boot') || 'null'); }catch(e){ return null; } };
const saveBoot = b => { try{ localStorage.setItem('qa_boot', JSON.stringify(b)); }catch(e){} };
function applyBoot(b, anim){
  const sel = $('#sheetSel');
  sel.innerHTML = b.sheets.map(n => `<option>${esc(n)}</option>`).join(''); sel.value = b.name; sel.onchange = () => load(sel.value);
  current = b.name; $('#month').value = monthFromName(b.name) || new Date().toISOString().slice(0,7);
  STATE = b.data; lastJson = JSON.stringify(STATE);
  DASH = b.dash || null; dashJson = DASH ? JSON.stringify(DASH) : ''; dashErr = b.dashErr || '';
  DASHM = b.month || null; dashmJson = DASHM ? JSON.stringify(DASHM) : '';
  SCORES = b.scores || null; scoresJson = SCORES ? JSON.stringify(SCORES) : '';
  const y = scrollY; render(anim); scrollTo(0, y);
}

/* ---------- লোগো (gtpl_logo.png না পেলে লেখা দিয়ে একই লোগো) ---------- */
$('#logoImg').addEventListener('error', () => {
  $('#logoBox').innerHTML = '<span class="lg"><span class="r1"><span class="a">GTPL</span> <span class="b">KCBPL</span></span><small>Digital Cable TV &amp; Broadband</small></span>';
});
$('#dateChip').textContent = '📅 ' + new Date().toLocaleDateString('bn-BD-u-nu-latn', {weekday:'long', day:'numeric', month:'long', year:'numeric'});

/* ---------- API ---------- */
function getKey(){
  let k = localStorage.getItem('qa_key');
  if (!k){ k = prompt('Passkey দিন:') || ''; if (k) localStorage.setItem('qa_key', k); }
  return k;
}
async function run(fn, ...args){
  const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ fn: fn, args: args, key: getKey() }) });
  const j = await r.json();
  if (!j.ok){
    if (j.error === 'Unauthorized'){ localStorage.removeItem('qa_key'); throw new Error('Passkey ভুল, রিফ্রেশ করে আবার দিন'); }
    throw new Error(j.error);
  }
  return j.data;
}
function toast(msg, ms=3000){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), ms);
}
function setLive(ok){
  $('#live').classList.toggle('off', !ok);
  $('#liveTxt').textContent = ok ? 'Live · ' + new Date().toLocaleTimeString('bn-BD-u-nu-latn', {hour:'2-digit', minute:'2-digit', second:'2-digit'}) : 'সংযোগ নেই';
}
function monthFromName(n){
  const M=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
  const s=n.toLowerCase(), y=s.match(/20\d{2}/); let m=0;
  M.forEach((x,i)=>{ if(s.indexOf(x)>-1) m=i+1; });
  return (y&&m)? y[0]+'-'+String(m).padStart(2,'0') : '';
}

/* ---------- নেভিগেশন ও রাউটিং (#home, #catv, #bbtech, #bbrenew, #outbound) ---------- */
function buildNav(){
  const nav = $('#nav');
  nav.insertAdjacentHTML('beforeend', PAGES.map(p => `<a href="#${p.key}" data-p="${p.key}">${p.ico} ${esc(p.label)}${p.key === 'home' ? '' : ` <span class="nb" data-nb="${p.key}">–</span>`}</a>`).join(''));
}
function placePill(){
  const a = document.querySelector('#nav a.on'), p = $('#pill'); if (!a) return;
  p.style.left = a.offsetLeft + 'px'; p.style.width = a.offsetWidth + 'px';
  const pg = PAGES.find(x => x.key === PAGE);
  p.style.background = `linear-gradient(90deg,${pg.c[0]},${pg.c[1]})`;
  const nav = $('#nav'); nav.scrollTo({left: Math.max(a.offsetLeft - 40, 0), behavior: 'smooth'});
}
function updateNavBadges(){
  if (!STATE) return;
  const m = mapSections();
  CATS.forEach(p => { const el = document.querySelector(`[data-nb="${p.key}"]`); if (el){ const a = agg(m[p.key]); el.textContent = a.done + '/' + a.target; } });
  placePill();
}
function route(){
  const k = (location.hash || '#home').slice(1);
  PAGE = PAGES.some(p => p.key === k) ? k : 'home';
  document.body.dataset.page = PAGE === 'home' ? 'home' : 'cat'; document.body.dataset.pg = PAGE;
  $('#content').classList.toggle('locked', locked && !isManual());
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.p === PAGE));
  document.title = 'QA Audit · ' + PAGES.find(p => p.key === PAGE).label;
  placePill(); scrollTo({top: 0});
  if (STATE) render(true);
}
addEventListener('hashchange', route);
addEventListener('resize', placePill);

/* ---------- সেকশন → পেজ ম্যাপিং ---------- */
function mapSections(){
  const map = {}, used = new Set(); CATS.forEach(p => map[p.key] = []);
  STATE.sections.forEach((s, si) => { const p = CATS.find(p => p.re.test(s.name)); if (p){ map[p.key].push(si); used.add(si); } });
  const free = CATS.filter(p => !map[p.key].length);          // নাম না মিললে ক্রম অনুযায়ী বসাবে
  STATE.sections.forEach((s, si) => { if (used.has(si)) return; const p = free.shift(); if (p){ map[p.key].push(si); used.add(si); } });
  return map;
}
const ndone = a => a.ticks.filter(Boolean).length;
const nlive = a => a.live.filter(Boolean).length;
function agg(idx){
  let target = 0, done = 0, left = 0, extra = 0, agents = 0, full = 0;
  idx.forEach(si => STATE.sections[si].agents.forEach(a => { const n = ndone(a); target += a.target; done += n; left += Math.max(a.target - n, 0); extra += nlive(a); agents++; if (n >= a.target) full++; }));
  return {target, done, left, extra, agents, full, pct: target ? Math.min(done / target, 1) : 0};
}
const hasDash = () => !!(DASH && DASH.sheet === current);
const hasMonth = () => !!(DASHM && DASHM.sheet === current);
/* মাসের ১ তারিখ থেকে ১০ দিন করে ৩টা ভাগ: 1–10, 11–20, 21–শেষ */
function monthChunks(){
  const d = DASHM.days, n = d.length, today = DASHM.today || '';
  return [[0, 10], [10, 20], [20, n]].filter(r => r[0] < n).map(([a, b]) => {
    const ks = d.slice(a, Math.min(b, n));
    const data = ks.map(k => k > today ? null : DASHM.total[d.indexOf(k)]);
    return {
      title: dfmt(ks[0]) + ' – ' + dfmt(ks[ks.length - 1]),
      labels: ks.map(k => [String(+k.slice(8)), k === today ? 'আজ' : wdShort(k)]),
      data: data, colors: ks.map(k => k === today ? '#ff4fa3' : '#7c4dff'),
      sum: data.reduce((s, x) => s + (x || 0), 0)
    };
  });
}
function dashSeries(idx){
  const arr = new Array(DASH.days.length).fill(0);
  idx.forEach(si => { const s = DASH.sections[si]; if (s) s.counts.forEach((c, i) => arr[i] += c); });
  return arr;
}
const BN_WD = ['রবি','সোম','মঙ্গল','বুধ','বৃহঃ','শুক্র','শনি'];
const dDate = k => new Date(k + 'T00:00:00');
const dfmt = k => dDate(k).toLocaleDateString('bn-BD-u-nu-latn', {day:'numeric', month:'short'});
const wdShort = k => BN_WD[dDate(k).getDay()];
const wdFull = k => dDate(k).toLocaleDateString('bn-BD-u-nu-latn', {weekday:'long'});
const axisLab = (k, i, n) => [i === n - 1 ? 'আজ' : i === n - 2 ? 'গতকাল' : wdShort(k), dfmt(k)];   // 2 লাইন: বার + তারিখ

/* ---------- লোড ---------- */
async function init(){
  buildNav(); route();
  $('#content').innerHTML = loaderHtml('ডাটা আনা হচ্ছে'); ldrStart();
  const c = readBoot(); let shown = false;
  if (c && c.data){ try{ applyBoot(c, true); shown = true; $('#liveTxt').textContent = 'আপডেট হচ্ছে…'; }catch(e){} }
  try{
    const b = await run('bootstrap', shown ? c.name : '');
    applyBoot(b, !shown); saveBoot(b); setLive(true);
    loadAuto();
    setTimeout(pollLoop, POLL_MS);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });   // ট্যাবে ফিরলেই সাথে সাথে আপডেট
    addEventListener('focus', () => poll());
  }catch(e){
    if (!shown) $('#content').innerHTML = '<div class="loader">⚠️ ' + esc(e.message) + '</div>';
    setLive(false);
  }
  ldrStop();
}
async function refreshSheetList(keep){
  const names = await run('getSheets'), sel = $('#sheetSel');
  sel.innerHTML = names.map(n => `<option>${esc(n)}</option>`).join('');
  sel.value = names.indexOf(keep) > -1 ? keep : names[names.length - 1];
  return sel.value;
}
async function load(name, retried){
  current = name; DASH = null; dashJson = ''; DASHM = null; dashmJson = ''; dashErr = ''; SCORES = null; scoresJson = '';
  $('#month').value = monthFromName(name) || new Date().toISOString().slice(0,7);
  $('#content').innerHTML = loaderHtml('লোড হচ্ছে'); ldrStart();
  try{
    const b = await run('bootstrap', name);
    applyBoot(b, true); saveBoot(b); setLive(true);
  }catch(e){
    if (!retried && /Sheet পাওয়া যায়নি/.test(e.message)){
      try{ const n = await refreshSheetList(name); ldrStop(); return load(n, true); }catch(_){}
    }
    $('#content').innerHTML = '<div class="loader">⚠️ ' + esc(e.message) + '</div>'; setLive(false);
  }
  ldrStop();
}
async function loadDash(){          // শেষ 7 দিনের কাউন্ট (raw data থেকে)
  const for_ = current;
  try{
    const d = await run('getDashboard', current, 7);
    if (for_ !== current) return;
    dashErr = '';
    const j = JSON.stringify(d);
    if (j !== dashJson){
      dashJson = j; DASH = d;
      if (busy || $('#modal').classList.contains('show')) return;
      if (PAGE === 'home'){ const y = scrollY; render(false); scrollTo(0, y); } else drawCharts();
    }
  }catch(e){
    dashErr = /Unknown function/.test(e.message) ? 'Code.gs-এ getDashboard নেই। নতুন Code.gs পেস্ট করে Deploy → Manage deployments → New version দিন।' : e.message;
    if (!DASH && PAGE === 'home' && STATE) render(false);
  }
}
async function loadMonth(){
  if (LITE) return;         // মাসের ১ তারিখ থেকে দিন-ভিত্তিক মোট অডিট (Home-এর ৩টা চার্টের ডাটা)
  const for_ = current;
  try{
    const d = await run('getDashboard', current, 'month');
    if (for_ !== current) return;
    const j = JSON.stringify(d);
    if (j !== dashmJson){
      dashmJson = j; DASHM = d;
      if (busy || $('#modal').classList.contains('show')) return;
      if (PAGE === 'home'){ const y = scrollY; render(false); scrollTo(0, y); }
    }
  }catch(e){ if (!dashErr) dashErr = e.message; }
}
let polling = false;
async function pollLoop(){ await poll(); setTimeout(pollLoop, LITE ? 12000 : POLL_MS); }
async function poll(){
  if (polling || busy || document.hidden || $('#modal').classList.contains('show') || !current) return;
  polling = true;
  try{
    const d = await run('getData', current);
    setLive(true);
    if (busy) return;
    const j = JSON.stringify(d);
    if (j !== lastJson){
      const fresh = diffTicks(STATE, d);
      lastJson = j; STATE = d; const y = scrollY; render(false); scrollTo(0, y);
      if (fresh.length){ flash(fresh); toast(`🆕 ${fresh.length}টি নতুন টিক পড়েছে`, 4500); }
      loadScores(); loadDash(); if (PAGE === 'home') loadMonth();   // টিক বদলালে দিন-ভিত্তিক গণনাও সাথে সাথে নতুন করে আনো
    }
    if (++pollN % 5 === 0){ loadAuto(); loadScores(); loadDash(); if (PAGE === 'home') loadMonth(); }
  }catch(e){ setLive(false); }
  finally{ polling = false; }
}
function diffTicks(a, b){
  const out = []; if (!a) return out;
  b.sections.forEach((s, si) => { const os = a.sections[si]; if (!os) return;
    s.agents.forEach((ag, ai) => { const o = os.agents.find(x => x.id === ag.id && x.name === ag.name); if (!o) return;
      ag.ticks.forEach((t, i) => { if (t && !o.ticks[i]) out.push([si, ai, i]); }); }); });
  return out;
}
function flash(list){
  list.forEach(([si, ai, i], n) => {
    const tr = document.querySelector(`tr[data-s="${si}"][data-a="${ai}"]`); if (!tr) return;
    const c = tr.querySelectorAll('.cb:not([data-live])')[i];
    setTimeout(() => { if (c){ c.classList.add('auto'); } }, 40 * n);
  });
  const first = list[0]; const tr = first && document.querySelector(`tr[data-s="${first[0]}"][data-a="${first[1]}"]`);
  if (tr) confetti(tr.getBoundingClientRect());
}
async function loadAuto(){
  try{
    const s = await run('getAutoStatus'), el = $('#auto');
    el.classList.toggle('off', s.on === false || !!s.err);
    $('#autoTxt').textContent = s.err ? 'Auto-tick: এরর' : s.on === false ? 'Auto-tick বন্ধ' :
      'Auto-tick ON' + (s.last ? ' · ' + new Date(s.last).toLocaleTimeString('bn-BD-u-nu-latn', {hour:'2-digit', minute:'2-digit'}) : '');
    el.title = s.err ? s.err : 'ক্লিক করলে এখনই raw data মিলিয়ে টিক দেবে';
  }catch(e){}
}
$('#auto').onclick = async () => {
  if (busy) return; busy++; toast('⏳ raw data মেলানো হচ্ছে…', 8000);
  try{
    const r = await run('autoSyncNow');
    if (r && r.error) throw new Error(r.error);
    await reloadSilent(); loadAuto();
    toast(r && r.changed ? `✅ ${r.changed} জনের নতুন টিক পড়েছে` : '✅ সব আপ-টু-ডেট');
  }catch(e){ toast('⚠️ ' + e.message, 5000); }
  busy--;
};

/* ---------- চার্ট ---------- */
const CH = {};
function killCharts(){ Object.keys(CH).forEach(k => { try{ CH[k].destroy(); }catch(_){} delete CH[k]; }); }
if (window.Chart){
  Chart.defaults.font.family = "'Hind Siliguri',sans-serif";
  Chart.defaults.color = '#7a7399';
  Chart.register({ id:'vals', afterDatasetsDraw(c){
    const o = c.options.plugins && c.options.plugins.vals; if (!o || !o.on) return;
    const ctx = c.ctx; ctx.save(); ctx.font = '700 11px Hind Siliguri'; ctx.fillStyle = '#241a4d'; ctx.textAlign = 'center';
    c.data.datasets.forEach((ds, i) => { if (ds.type === 'line') return; const meta = c.getDatasetMeta(i); if (meta.hidden) return;
      meta.data.forEach((el, j) => { const v = ds.data[j]; if (v == null) return; ctx.fillText(v, el.x, el.y - 5); }); });
    ctx.restore();
  }});
}
function opts(o){
  o = o || {};
  const axes = o.noAxes ? {x:{display:false}, y:{display:false, beginAtZero:true}} : {
    x:{stacked:!!o.stack, grid:{display:false}, ticks:{font:{size:11}}},
    y:{stacked:!!o.stack, beginAtZero:true, grid:{color:'rgba(124,77,255,.09)'}, ticks:{precision:0, font:{size:11}}}};
  return {
    responsive:true, maintainAspectRatio:false,
    animation:{duration:1100, easing:'easeOutQuart'},
    layout:{padding:o.pad || {top:20}},
    cutout:o.donut ? '66%' : undefined,
    plugins:{
      legend:{display:!!o.legend, position:'bottom', labels:{usePointStyle:true, boxWidth:8, font:{size:11}}},
      tooltip:{backgroundColor:'#241a4d', padding:10, cornerRadius:10, titleFont:{weight:'700'}},
      vals:{on:!!o.vals}
    },
    scales:o.donut ? {} : axes
  };
}
function chart(id, type, labels, datasets, options){
  if (!window.Chart) return;
  const el = document.getElementById(id); if (!el) return;
  const c = CH[id];
  if (c && c.canvas === el){
    c.data.labels = labels;
    if (c.data.datasets.length === datasets.length) datasets.forEach((d, i) => { c.data.datasets[i].data = d.data; if (d.backgroundColor) c.data.datasets[i].backgroundColor = d.backgroundColor; });
    else c.data.datasets = datasets;
    c.update(); return;
  }
  CH[id] = new Chart(el, {type, data:{labels, datasets}, options});
}
function drawCharts(){
  if (!window.Chart || !STATE || LITE) return;
  if (PAGE === 'home') drawHome(); else drawCat(PAGE);
}
function trendSets(total, hiLast, hiPrev, base){
  const n = total.length;
  return [
    {type:'bar', label:'অডিট', data:total, backgroundColor:total.map((_, i) => i === n - 1 ? hiLast : i === n - 2 ? hiPrev : base), borderRadius:10, borderSkipped:false, maxBarThickness:46},
    {type:'line', label:'ট্রেন্ড', data:total, borderColor:'#241a4d', backgroundColor:'#241a4d', tension:.4, pointRadius:4, borderWidth:2}
  ];
}
function drawHome(){
  const m = mapSections();
  if (hasDash()){
    const n = DASH.days.length, lab = DASH.days.map((k, i) => axisLab(k, i, n));
    const sets = RAWCATS.map(p => ({label:p.label, data:dashSeries(m[p.key]), backgroundColor:p.c[0], borderRadius:5, stack:'s', maxBarThickness:46}));
    const oth = DASH.total.map((t, i) => t - sets.reduce((s, d) => s + d.data[i], 0));
    if (oth.some(x => x > 0)) sets.push({label:'অন্যান্য', data:oth, backgroundColor:'#c9c3de', borderRadius:5, stack:'s', maxBarThickness:46});
    chart('c7s', 'bar', lab, sets, opts({stack:true, legend:true}));
    RAWCATS.forEach(p => chart('sp_' + p.key, 'line', lab, [{label:p.label, data:dashSeries(m[p.key]), borderColor:p.c[0], backgroundColor:alpha(p.c[0], .18), fill:true, tension:.4, pointRadius:0, borderWidth:2}], opts({noAxes:true, pad:{top:4, bottom:2}})));
  }
  if (hasMonth()) monthChunks().forEach((c, i) => chart('m' + i, 'bar', c.labels, [{label:'অডিট', data:c.data, backgroundColor:c.colors, borderRadius:8, borderSkipped:false, maxBarThickness:44}], opts({vals:true})));
  const A = CATS.map(p => agg(m[p.key]));
  chart('cCat', 'bar', CATS.map(p => p.label), [
    {label:'Target', data:A.map(a => a.target), backgroundColor:'#d9ccff', borderRadius:8, borderSkipped:false},
    {label:'Completed', data:A.map(a => a.done), backgroundColor:'#7c4dff', borderRadius:8, borderSkipped:false},
    {label:'Extra / Live', data:A.map(a => a.extra), backgroundColor:'#ffb02e', borderRadius:8, borderSkipped:false}
  ], opts({legend:true, vals:true}));
  chart('cDonut', 'doughnut', CATS.map(p => p.label), [{data:A.map(a => a.done), backgroundColor:CATS.map(p => p.c[0]), borderColor:'#fff', borderWidth:3, hoverOffset:12}], opts({donut:true, legend:true}));
}
function drawCat(key){
  const p = PAGES.find(x => x.key === key), idx = mapSections()[key]; if (!idx.length) return;
  const a = agg(idx);
  if (hasDash() && !p.manual){
    const n = DASH.days.length, lab = DASH.days.map((k, i) => axisLab(k, i, n));
    chart('pc7', 'bar', lab, trendSets(dashSeries(idx), p.c[0], p.c[1], alpha(p.c[0], .45)), opts({vals:true}));
  }
  chart('pcD', 'doughnut', ['Completed', 'Remaining', 'Extra / Live'], [{data:[a.done, a.left, a.extra], backgroundColor:[p.c[0], '#e4dcff', '#ffb02e'], borderColor:'#fff', borderWidth:3, hoverOffset:12}], opts({donut:true, legend:true}));
  const b = [0, 0, 0, 0, 0, 0];
  idx.forEach(si => STATE.sections[si].agents.forEach(g => { const r = ndone(g) / g.target; b[r === 0 ? 0 : r <= .25 ? 1 : r <= .5 ? 2 : r <= .75 ? 3 : r < 1 ? 4 : 5]++; }));
  chart('pcH', 'bar', ['0%', '1–25%', '26–50%', '51–75%', '76–99%', '100%'], [{label:'এজেন্ট', data:b, backgroundColor:['#ff6b6b', '#ff9a5c', '#ffd166', '#9be37a', '#1fd6a0', '#00b8f0'], borderRadius:8, borderSkipped:false}], opts({vals:true}));
}

let enterT = null;
function render(anim){
  killCharts();
  const box = $('#content');
  if (!STATE){ box.innerHTML = loaderHtml('লোড হচ্ছে…'); return; }
  box.classList.toggle('enter', !!anim);
  if (PAGE === 'home') renderHome(box); else renderCat(box, PAGES.find(p => p.key === PAGE));
  updateNavBadges();
  clearTimeout(enterT); if (anim) enterT = setTimeout(() => box.classList.remove('enter'), 1900);
  drawCharts();
  document.querySelectorAll('#content [data-n]').forEach(countUp);
}

function ringSvg(pct){
  return `<svg viewBox="0 0 100 100"><defs><linearGradient id="grad"><stop offset="0" stop-color="#ff4fa3"/><stop offset=".5" stop-color="#7c4dff"/><stop offset="1" stop-color="#1fd6a0"/></linearGradient></defs>
     <circle class="bg" cx="50" cy="50" r="42"/><circle class="fg" cx="50" cy="50" r="42" style="stroke-dashoffset:${264 * (1 - pct)}"/></svg>`;
}

function renderHome(box){
  const m = mapSections(), all = agg(STATE.sections.map((_, i) => i)), D = hasDash();
  const n = D ? DASH.days.length : 0;
  const today = D ? DASH.total[n - 1] : null, yest = D ? DASH.total[n - 2] : null;
  const wk = D ? DASH.total.reduce((s, x) => s + x, 0) : null;

      else if (D){ const s = dashSeries(m[p.key]); t = `<div class="spk"><canvas id="sp_${p.key}"></canvas></div><div class="cc-t">আজ <b>${s[n - 1]}</b> · গতকাল <b>${s[n - 2]}</b> · 7 দিনে <b>${s.reduce((x, y) => x + y, 0)}</b></div>`; }
      return `<a class="cc rise" href="#${p.key}" style="--a:${p.c[0]};--b:${p.c[1]};--d:${420 + i * 80}ms"><div class="cc-h"><span>${p.ico}</span>${esc(p.label)}<i>→</i></div>

function buildSection(si, p, box){
  const sec = STATE.sections[si];
  const div = document.createElement('div'); div.className = 'sec'; div.dataset.s = si;
  let head = '<tr class="g"><th class="id"></th><th class="nm"></th><th colspan="4"></th><th colspan="8">Audit 1 – 8</th><th class="gap"></th><th colspan="8">Audit 9 – 16</th><th colspan="3">Result</th><th colspan="4">Live call audit</th><th>Extra</th><th></th></tr>';
  head += '<tr><th class="id">ID</th><th class="nm">Agent Name</th><th>DOJ</th><th>Gender</th><th>Week</th><th>Target</th>';
  for (let i = 1; i <= PER; i++){ if (i === 9) head += '<th class="gap"></th>'; head += `<th>${i}</th>`; }
  head += '<th>Total</th><th>Left</th><th>Progress</th><th>1</th><th>2</th><th>3</th><th>4</th><th>Total</th><th></th></tr>';
  const widths = [100,240,118,66,98,48].concat(Array(8).fill(28), [10], Array(8).fill(28), [48,48,84], Array(4).fill(28), [48,66]);
  const colgroup = '<colgroup>' + widths.map(w => `<col style="width:${w}px">`).join('') + '</colgroup>';
  const tw = widths.reduce((x, y) => x + y, 0);
  div.innerHTML = `<div class="sec-h" style="--a:${p.c[0]};--b:${p.c[1]}"><h2>${esc(sec.name)}</h2><span class="chip" data-sc></span><span class="sp"></span><button class="btn" data-add="${si}">➕ এজেন্ট যোগ</button></div>
    <div class="scroll"><table style="width:${tw}px">${colgroup}<thead>${head}</thead><tbody></tbody></table></div>`;
  const tb = div.querySelector('tbody');
  sec.agents.forEach((a, ai) => {
    const col = PALETTE[(ai + si * 3) % PALETTE.length];
    const tr = document.createElement('tr'); tr.className = 'ag'; tr.dataset.s = si; tr.dataset.a = ai;
    tr.dataset.k = (a.id + ' ' + a.name).toLowerCase();
    tr.style.setProperty('--d', Math.min(ai * 16, 500) + 'ms');
    const gcls = /^f/i.test(a.gender) ? 'f' : 'm';
    let h = `<td class="id"><div class="cell"><span class="t">${esc(a.id)}</span>${a.id ? `<button class="cp" data-copy="${esc(a.id)}" title="ID কপি">📋</button>` : ''}</div></td><td class="nm"><div class="cell"><span class="t">${a.name ? esc(a.name) : '<i style="opacity:.45;font-weight:400">নাম নেই</i>'}</span><span class="scw" data-score></span>${a.name ? `<button class="cp" data-copy="${esc(a.name)}" title="নাম কপি">📋</button>` : ''}</div></td>
      <td class="dim">${esc(a.doj) || '–'}</td><td>${a.gender ? `<span class="g ${gcls}">${esc(a.gender)}</span>` : '–'}</td><td class="dim">${esc(a.week) || '–'}</td><td class="num">${a.target}</td>`;
    for (let i = 0; i < PER; i++){
      if (i === 8) h += '<td class="gap"></td>';
      h += `<td><button class="cb ${a.ticks[i] ? 'on' : ''}" style="--col:${col}" data-i="${i}" aria-label="Audit ${i+1}"></button></td>`;
    }
    h += '<td class="num" data-done></td><td class="num left" data-left></td><td><div class="pb"><i></i></div></td>';
    for (let i = 0; i < 4; i++) h += `<td><button class="cb ${a.live[i] ? 'on' : ''}" style="--col:${col}" data-live="${i}" aria-label="Live ${i+1}"></button></td>`;
    h += `<td class="num ext" data-ext></td><td class="act"><button class="e" data-edit title="এডিট">✏️</button> <button class="d" data-del title="ডিলিট">🗑️</button></td>`;
    tr.innerHTML = h; tb.appendChild(tr);
    refreshRow(tr, true); paintScore(tr);
  });
  if (!sec.agents.length) tb.innerHTML = '<tr><td colspan="40" class="empty">কোনো এজেন্ট নেই</td></tr>';
  box.appendChild(div);
  updateSecChip(si);
}

function refreshRow(tr, skipStats){
  const si = +tr.dataset.s, a = STATE.sections[si].agents[+tr.dataset.a];
  const n = ndone(a), ex = nlive(a);
  tr.querySelector('[data-done]').textContent = n;
  tr.querySelector('[data-left]').textContent = Math.max(a.target - n, 0);
  tr.querySelector('[data-ext]').textContent = ex;
  { const r = a.target ? n / a.target : 0, bar = tr.querySelector('.pb i'), c = pbColor(r); bar.style.width = Math.min(r * 100, 100) + '%'; bar.style.background = `linear-gradient(90deg,${c[0]},${c[1]})`; bar.parentNode.title = Math.round(Math.min(r, 1) * 100) + '%'; }
  tr.classList.toggle('done', n >= a.target);
  if (!skipStats){ updateSecChip(si); updateStats(); }
}
function updateSecChip(si){
  const sec = STATE.sections[si];
  const t = sec.agents.reduce((s, a) => s + ndone(a), 0), e = sec.agents.reduce((s, a) => s + nlive(a), 0);
  const tg = sec.agents.reduce((s, a) => s + a.target, 0);
  const el = document.querySelector(`.sec[data-s="${si}"] [data-sc]`);
  if (el) el.textContent = `${t} + ${e} extra = ${t + e} / ${tg}`;
}

function updateStats(){
  if (!STATE || PAGE === 'home' || !$('#stats')) return;
  const a = agg(mapSections()[PAGE] || []);
  $('#stats').innerHTML = `
   <div class="stat" style="--g:linear-gradient(#7c4dff,#00b8f0)"><small>Total Target</small><b data-n="${a.target}" data-k="t">${a.target}</b></div>
   <div class="stat" style="--g:linear-gradient(#1fd6a0,#00b8f0)"><small>Completed</small><b data-n="${a.done}" data-k="d">${a.done}</b></div>
   <div class="stat" style="--g:linear-gradient(#ff4fa3,#ffb02e)"><small>Remaining</small><b data-n="${a.left}" data-k="l">${a.left}</b></div>
   <div class="stat" style="--g:linear-gradient(#ffb02e,#ff7a45)"><small>Extra / Live call</small><b data-n="${a.extra}" data-k="e">${a.extra}</b></div>
   <div class="stat" style="--g:linear-gradient(#7c4dff,#ff4fa3)"><small>Total incl. extra</small><b data-n="${a.done + a.extra}" data-k="x">${a.done + a.extra}</b></div>
   <div class="stat ring">${ringSvg(a.pct)}<div><small>Progress</small><b>${(a.pct * 100).toFixed(1)}%</b></div></div>`;
  document.querySelectorAll('#stats [data-n]').forEach(countUp);
  if (a.pct >= 1 && lastDone < 1) confetti({left: innerWidth / 2, top: 160, width: 0, height: 0});
  lastDone = a.pct;
  updateNavBadges(); drawCharts();
}
function countUp(el){
  const to = +el.dataset.n, key = PAGE + '|' + (el.dataset.k || ''), prev = window.__prev = window.__prev || {};
  const from = +(prev[key] || 0), t0 = performance.now();
  (function f(t){ const k = Math.min((t - t0) / 800, 1); el.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(f); else prev[key] = to; })(t0);
}

/* ---------- কপি ---------- */
async function copyText(txt, btn){
  try{ await navigator.clipboard.writeText(txt); }
  catch(e){ const t = document.createElement('textarea'); t.value = txt; document.body.appendChild(t); t.select(); try{ document.execCommand('copy'); }catch(_){} t.remove(); }
  if (btn){ const o = btn.textContent; btn.textContent = '✅'; setTimeout(() => btn.textContent = o, 900); }
  toast('📋 কপি হয়েছে: ' + txt, 1800);
}

/* ---------- লক ---------- */
let locked = true, lockT = null;
function setLock(v, auto){
  locked = v;
  const b = $('#lockBtn');
  b.textContent = v ? '🔒 Locked' : '🔓 Unlocked';
  b.classList.toggle('open', !v);
  $('#content').classList.toggle('locked', v && !isManual());
  clearTimeout(lockT);
  if (!v) armLock();
  if (auto) toast('🔒 কিছুক্ষণ কাজ না করায় আবার লক হয়েছে', 3000);
}
function armLock(){ clearTimeout(lockT); if (!locked) lockT = setTimeout(() => setLock(true, true), 180000); }
$('#lockBtn').onclick = () => { setLock(!locked); toast(locked ? '🔒 লক হয়েছে' : '🔓 আনলক: এখন টিক বদলানো যাবে (3 মিনিট কাজ না করলে আবার লক)', 3000); };
setLock(true);

/* ---------- খোঁজা ---------- */
function filterRows(){
  const q = $('#q').value.trim().toLowerCase();
  document.querySelectorAll('tr.ag').forEach(tr => { tr.style.display = (!q || tr.dataset.k.indexOf(q) > -1) ? '' : 'none'; });
}
$('#q').oninput = filterRows;

/* ---------- ক্লিক হ্যান্ডলার ---------- */
$('#content').addEventListener('click', e => {
  const cp = e.target.closest('[data-copy]');
  if (cp){ copyText(cp.dataset.copy, cp); return; }
  const addB = e.target.closest('[data-add]');
  if (addB) return openAgentModal('add', +addB.dataset.add);
  const tr = e.target.closest('tr.ag'); if (!tr) return;
  const si = +tr.dataset.s, ai = +tr.dataset.a, a = STATE.sections[si].agents[ai];
  if (e.target.closest('[data-edit]')) return openAgentModal('edit', si, a);
  if (e.target.closest('[data-del]')) return openDeleteModal(a);
  const b = e.target.closest('.cb'); if (!b) return;
  if (locked && !isManual()){ const L = $('#lockBtn'); L.classList.remove('shake'); void L.offsetWidth; L.classList.add('shake'); toast('🔒 ম্যানুয়াল টিকের জন্য উপরের লক বাটনে ক্লিক করে আগে আনলক করুন', 3500); return; }
  armLock();
  const live = b.dataset.live !== undefined, idx = live ? +b.dataset.live : +b.dataset.i;
  const arr = live ? a.live : a.ticks;
  arr[idx] = !arr[idx];
  b.classList.toggle('on', arr[idx]); b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');
  refreshRow(tr);
  lastJson = JSON.stringify(STATE);
  if (!live && arr[idx] && arr.every(Boolean)) confetti(b.getBoundingClientRect());
  busy++;
  run('setTick', current, a.row, idx, arr[idx], live).catch(err => {
    arr[idx] = !arr[idx]; b.classList.toggle('on', arr[idx]); refreshRow(tr); toast('⚠️ সেভ হয়নি: ' + err.message, 5000);
  }).finally(() => { busy--; });
});

/* ---------- মোডাল ---------- */
let modalOk = null;
function showModal(title, body, okText, okFn, danger){
  $('#mTitle').textContent = title; $('#mBody').innerHTML = body;
  const ok = $('#mOk'); ok.textContent = okText; ok.className = 'btn ' + (danger ? 'b-del' : 'b-sync');
  modalOk = okFn; $('#modal').classList.add('show');
  const f = $('#mBody input'); if (f) setTimeout(() => f.focus(), 50);
}
function closeModal(){ $('#modal').classList.remove('show'); modalOk = null; }
$('#mCancel').onclick = closeModal;
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
$('#mOk').onclick = async () => {
  if (!modalOk) return;
  const ok = $('#mOk'); ok.disabled = true;
  try{ await modalOk(); closeModal(); }catch(e){ toast('⚠️ ' + e.message, 5000); }
  ok.disabled = false;
};
addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); if (e.key === 'Enter' && $('#modal').classList.contains('show') && e.target.tagName === 'INPUT') $('#mOk').click(); });

function openAgentModal(mode, si, a){
  a = a || {id:'', name:'', doj:'', gender:'Male'};
  const body = `<label>Employee ID</label><input type="text" id="fId" value="${esc(a.id)}">
    <label>Agent Name</label><input type="text" id="fName" value="${esc(a.name)}">
    <label>DOJ (যেমন 16.04.2026)</label><input type="text" id="fDoj" value="${esc(a.doj)}">
    <label>Gender</label><select id="fGen"><option ${/^m/i.test(a.gender) ? 'selected' : ''}>Male</option><option ${/^f/i.test(a.gender) ? 'selected' : ''}>Female</option><option value="" ${!a.gender && mode === 'edit' ? 'selected' : ''}>(ফাঁকা)</option></select>`;
  showModal(mode === 'add' ? 'নতুন এজেন্ট যোগ' : 'এজেন্ট এডিট', body, 'সেভ', async () => {
    const p = { id: $('#fId').value, name: $('#fName').value, doj: $('#fDoj').value, gender: $('#fGen').value };
    busy++;
    try{
      if (mode === 'add') await run('addAgent', current, si, p); else await run('updateAgent', current, a.row, p);
      await reloadSilent(); toast(mode === 'add' ? '✅ এজেন্ট যোগ হয়েছে' : '✅ আপডেট হয়েছে');
    } finally { busy--; }
  });
}
function openDeleteModal(a){
  showModal('এজেন্ট ডিলিট', `<p style="margin:0;line-height:1.6">${esc(a.name || a.id)} (${esc(a.id)}) কে Google Sheet থেকে মুছে ফেলবেন? এটা ফেরানো যাবে না।</p>`, 'ডিলিট করুন', async () => {
    busy++;
    try{ await run('deleteAgent', current, a.row); await reloadSilent(); toast('🗑️ ডিলিট হয়েছে'); } finally { busy--; }
  }, true);
}
async function reloadSilent(){
  const y = scrollY; STATE = await run('getData', current); lastJson = JSON.stringify(STATE); render(false); scrollTo(0, y); setLive(true);
}

/* ---------- অটো মার্ক ---------- */
$('#syncBtn').onclick = async () => {
  const b = $('#syncBtn'); b.disabled = true; b.textContent = '⏳ সিঙ্ক হচ্ছে…'; busy++;
  try{
    const before = STATE.sections.map(s => s.agents.map(a => a.ticks.slice()));
    const r = await run('syncFromRaw', current, $('#month').value, $('#mode').value);
    await reloadSilent();
    let n = 0;
    STATE.sections.forEach((s, si) => s.agents.forEach((a, ai) => {
      const tr = document.querySelector(`tr[data-s="${si}"][data-a="${ai}"]`); if (!tr) return;
      a.ticks.forEach((t, i) => { if (t && before[si] && before[si][ai] && !before[si][ai][i]) { const c = tr.querySelectorAll('.cb:not([data-live])')[i]; setTimeout(() => c && c.classList.add('auto'), 20 * n++); } });
    }));
    toast(`✅ ${r.rawRows}টি raw কল, ${r.matched} জন মিলেছে, ${r.changed} জনের টিক বদলেছে`, 4500);
    if (n) confetti($('#syncBtn').getBoundingClientRect());
  }catch(e){ toast('⚠️ ' + e.message, 6000); }
  busy--; b.disabled = false; b.textContent = '⚡ Raw data থেকে অটো মার্ক';
};

/* ---------- নতুন মাস ---------- */
$('#newBtn').onclick = () => {
  const M = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const cm = monthFromName(current), d = new Date();
  let y = cm ? +cm.slice(0,4) : d.getFullYear(), m = cm ? +cm.slice(5) : d.getMonth() + 1;
  m++; if (m > 12){ m = 1; y++; }
  showModal('নতুন মাসের শিট', `<label>শিটের নাম (বর্তমান শিটের কপি, সব টিক খালি)</label><input type="text" id="fNew" value="Active List ${M[m-1]} ${y}">`, 'তৈরি করুন', async () => {
    const name = $('#fNew').value.trim(); if (!name) throw new Error('নাম দিন');
    busy++;
    try{
      await run('createMonthSheet', current, name);
      const names = await run('getSheets');
      $('#sheetSel').innerHTML = names.map(n => `<option>${esc(n)}</option>`).join('');
      $('#sheetSel').value = name; await load(name);
      toast('🎉 নতুন শিট তৈরি: ' + name); confetti($('#newBtn').getBoundingClientRect());
    } finally { busy--; }
  });
};
$('#refBtn').onclick = async () => { try{ const n = await refreshSheetList(current); await load(n); }catch(e){ load(current); } };
$('#lnkBtn').onclick = async () => {
  try{ await navigator.clipboard.writeText(location.href); toast('🔗 Link copy হয়েছে'); }
  catch(e){ prompt('Link copy করুন:', location.href); }
};

/* ---------- কনফেটি ---------- */
const cv = $('#fx'), cx = cv.getContext('2d'); let parts = [];
function size(){ cv.width = innerWidth; cv.height = innerHeight; } size(); addEventListener('resize', size);
function confetti(r){
  if (matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const x = r.left + (r.width || 0) / 2, y = r.top + (r.height || 0) / 2, wasEmpty = !parts.length;
  const cols = PALETTE.concat(['#ffb02e', '#1fd6a0', '#00b8f0']);
  for (let i = 0; i < 80; i++) parts.push({x, y, vx: (Math.random() - .5) * 11, vy: -Math.random() * 11 - 3, g: .35, s: 4 + Math.random() * 5, c: cols[i % cols.length], r: Math.random() * 6, vr: (Math.random() - .5) * .4, l: 85});
  if (wasEmpty) tick();
}
function tick(){
  cx.clearRect(0, 0, cv.width, cv.height);
  parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += p.g; p.r += p.vr; p.l--; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.globalAlpha = Math.max(p.l / 85, 0); cx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6); cx.restore(); });
  parts = parts.filter(p => p.l > 0);
  if (parts.length) requestAnimationFrame(tick); else cx.clearRect(0, 0, cv.width, cv.height);
}

/* ---------- Lite mode + Top/Bottom ---------- */
function setLite(v){
  LITE = v; try{ localStorage.setItem('qa_lite', v ? '1' : '0'); }catch(e){}
  document.body.classList.toggle('lite', v);
  $('#liteBtn').textContent = v ? '🏠 Go to main page' : '⚡ Go to lite mode';
  if (STATE){ const y = scrollY; render(false); scrollTo(0, y); if (!v) loadMonth(); }
  placePill();
}
$('#liteBtn').onclick = () => { setLite(!LITE); toast(LITE ? '⚡ Lite mode: শুধু টেবিল দেখাচ্ছে' : '🏠 মূল পেজে ফিরেছেন', 2500); };
$('#goTop').onclick = () => scrollTo({top: 0, behavior: LITE ? 'auto' : 'smooth'});
$('#goBot').onclick = () => scrollTo({top: document.documentElement.scrollHeight, behavior: LITE ? 'auto' : 'smooth'});
try{ setLite(localStorage.getItem('qa_lite') === '1'); }catch(e){ setLite(false); }

addEventListener('load', placePill);
init();
</script>
