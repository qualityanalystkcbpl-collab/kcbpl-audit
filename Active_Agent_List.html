<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QA Audit Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Baloo+Da+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#241a4d;--mute:#7a7399;--card:rgba(255,255,255,.82);--line:#ece7fb;--c1:#ff4fa3;--c2:#7c4dff;--c3:#00b8f0;--c4:#1fd6a0;--c5:#ffb02e}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Hind Siliguri',sans-serif;font-size:12.5px;color:var(--ink);min-height:100vh;
 background:radial-gradient(900px 500px at 5% -10%,#ffd3ea 0,transparent 60%),radial-gradient(800px 500px at 100% 0,#cfe9ff 0,transparent 60%),radial-gradient(900px 600px at 50% 110%,#d8ffe9 0,transparent 60%),#f6f2ff;
 background-attachment:fixed}
.wrap{max-width:1500px;margin:0 auto;padding:14px 14px 50px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
h1{font-family:'Baloo Da 2','Hind Siliguri',sans-serif;font-size:24px;margin:0;line-height:1;
 background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3),var(--c4),var(--c1));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s linear infinite}
@keyframes shine{to{background-position:300% 0}}
.live{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mute);background:var(--card);padding:4px 10px;border-radius:99px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--c4);box-shadow:0 0 0 0 rgba(31,214,160,.6);animation:pulse 1.8s infinite}
.live.off i{background:#ff6b6b;animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(31,214,160,0)}100%{box-shadow:0 0 0 0 rgba(31,214,160,0)}}
.bar{display:flex;flex-wrap:wrap;gap:7px;align-items:center;background:var(--card);padding:8px 10px;border-radius:14px;box-shadow:0 6px 20px rgba(124,77,255,.12);backdrop-filter:blur(8px)}
select,input,button{font:inherit}
select,input[type=month],input[type=text],input[type=search]{padding:6px 10px;border-radius:9px;border:1.5px solid var(--line);background:#fff;color:var(--ink);outline:none;font-size:12.5px}
select:focus,input:focus{border-color:var(--c2)}
.btn{border:0;padding:7px 13px;border-radius:10px;color:#fff;font-weight:600;cursor:pointer;transition:transform .15s,box-shadow .2s;background-size:200% 100%;font-size:12.5px}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 14px rgba(0,0,0,.16);background-position:100% 0}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.6;cursor:wait}
.b-sync{background-image:linear-gradient(90deg,var(--c2),var(--c3),var(--c2))}
.b-new{background-image:linear-gradient(90deg,var(--c1),var(--c5),var(--c1))}
.b-link{background-image:linear-gradient(90deg,var(--c4),var(--c3),var(--c4))}
.b-ghost{background:#efeaff;color:var(--c2)}
.b-del{background:linear-gradient(90deg,#ff5f6d,#ff8a5c)}
.sp{flex:1}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.stat{flex:1;min-width:130px;background:var(--card);border-radius:14px;padding:9px 14px;position:relative;overflow:hidden;box-shadow:0 4px 14px rgba(60,30,140,.07)}
.stat::before{content:'';position:absolute;inset:0 auto 0 0;width:5px;background:var(--g)}
.stat small{color:var(--mute);font-weight:600;font-size:11px}
.stat b{display:block;font-family:'Baloo Da 2',sans-serif;font-size:26px;line-height:1.1}
.stat.ring{display:flex;align-items:center;gap:10px;flex:1.2}
.ring svg{width:54px;height:54px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .bg{stroke:#ece6ff}
.ring .fg{stroke:url(#grad);stroke-dasharray:264;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.sec{background:var(--card);border-radius:16px;margin:14px 0;overflow:hidden;box-shadow:0 8px 24px rgba(60,30,140,.1)}
.sec-h{display:flex;align-items:center;gap:10px;padding:8px 14px;color:#fff;background:linear-gradient(90deg,var(--a),var(--b))}
.sec-h h2{margin:0;font-family:'Baloo Da 2',sans-serif;font-size:16px}
.chip{background:rgba(255,255,255,.24);padding:2px 10px;border-radius:99px;font-weight:600;font-size:11.5px}
.sec-h .sp{flex:1}
.sec-h .btn{background:rgba(255,255,255,.95);color:var(--ink);padding:4px 11px;font-size:11.5px}
.scroll{overflow-x:auto}
table{border-collapse:separate;border-spacing:0;table-layout:fixed;max-width:none}
th,td{padding:3px 4px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid var(--line);height:30px}
thead th{font-size:10.5px;color:var(--mute);font-weight:600;background:#faf8ff;padding:5px}
thead tr.g th{font-size:10.5px;color:var(--c2);background:#f1ecff}
td.id,th.id{position:sticky;left:0;z-index:2;background:#fff;text-align:left;font-weight:600;font-size:11.5px;padding-left:10px}
td.nm,th.nm{position:sticky;left:100px;z-index:2;background:#fff;text-align:left;font-weight:600;box-shadow:6px 0 8px -6px rgba(60,30,140,.18)}
thead th.id,thead th.nm{background:#faf8ff;z-index:3}
tr.ag:hover td{background:#faf7ff}
tr.ag.done td{background:#effcf6}
tr.ag.done td.id,tr.ag.done td.nm{background:#effcf6}
td.dim{color:var(--mute);font-size:11.5px}
.g{display:inline-block;padding:1px 8px;border-radius:99px;font-size:10.5px;font-weight:600}
.g.m{background:#e3efff;color:#1e6bff}
.g.f{background:#ffe3f3;color:#e0398a}
.cb{width:16px;height:16px;border-radius:5px;border:2px solid var(--col);background:transparent;display:inline-grid;place-items:center;cursor:pointer;padding:0;transition:transform .15s,background .15s;position:relative;vertical-align:middle}
.cb:hover{transform:scale(1.25)}
.cb.on{background:var(--col)}
.cb.on::after{content:'';width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.cb.pop{animation:pop .4s ease}
.cb.auto{animation:glow 1.1s ease}
@keyframes pop{40%{transform:scale(1.6) rotate(8deg)}}
@keyframes glow{0%{box-shadow:0 0 0 0 var(--col)}100%{box-shadow:0 0 0 11px transparent}}
td.gap,th.gap{padding:0;background:#faf8ff}
.num{font-family:'Baloo Da 2',sans-serif;font-size:15px}
.left{color:#e0398a}
.ext{color:#e07a00}
.pb{height:6px;background:#ece6ff;border-radius:99px;overflow:hidden;margin:0 6px}
.pb i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--c3),var(--c4));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.act button{border:0;background:#f1ecff;border-radius:7px;width:24px;height:24px;cursor:pointer;font-size:12px;transition:transform .15s,background .15s}
.act button:hover{transform:scale(1.15);background:#e2d8ff}
.act .d:hover{background:#ffd9de}
.empty{padding:16px;color:var(--mute);text-align:center}
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,100px);background:var(--ink);color:#fff;padding:9px 18px;border-radius:12px;font-weight:600;z-index:60;transition:transform .35s cubic-bezier(.2,1.4,.4,1);max-width:92vw}
.toast.show{transform:translate(-50%,0)}
.loader{text-align:center;padding:50px;font-size:14px;font-weight:600}
.spin{width:36px;height:36px;margin:0 auto 10px;border-radius:50%;border:5px solid #ddd0ff;border-top-color:var(--c1);border-right-color:var(--c3);animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.modal{position:fixed;inset:0;background:rgba(36,26,77,.4);backdrop-filter:blur(4px);display:none;place-items:center;z-index:50}
.modal.show{display:grid}
.mbox{background:#fff;border-radius:18px;padding:18px 20px;width:min(380px,92vw);box-shadow:0 20px 60px rgba(60,30,140,.35);animation:mp .25s cubic-bezier(.2,1.3,.4,1)}
@keyframes mp{from{transform:scale(.88);opacity:0}}
.mbox h3{margin:0 0 12px;font-family:'Baloo Da 2',sans-serif;font-size:18px}
.mbox label{display:block;font-size:11px;font-weight:600;color:var(--mute);margin:8px 0 3px}
.mbox input,.mbox select{width:100%;padding:8px 10px;font-size:13px}
.mrow{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
td.id .cell,td.nm .cell{display:flex;align-items:center;gap:3px}
.cell .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.cp{border:0;background:transparent;cursor:pointer;opacity:.35;font-size:11px;padding:2px 4px;border-radius:6px;transition:opacity .15s,background .15s,transform .15s;line-height:1}
tr.ag:hover .cp{opacity:.8}
.cp:hover{opacity:1!important;background:#e9e1ff;transform:scale(1.15)}
.b-lock{background-image:linear-gradient(90deg,#ff5f6d,#ff9a5c,#ff5f6d);min-width:128px}
.b-lock.open{background-image:linear-gradient(90deg,#1fd6a0,#00b8f0,#1fd6a0)}
.b-lock.shake{animation:shake .5s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
#content.locked .cb{cursor:not-allowed}
#content.locked .cb:hover{transform:none}
canvas{position:fixed;inset:0;pointer-events:none;z-index:40}
button:focus-visible,.cb:focus-visible{outline:2px solid var(--c2);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap">
  <div class="top">
    <h1>QA Audit Tracker</h1>
    <span class="live" id="live"><i></i><span id="liveTxt">লোড হচ্ছে…</span></span>
    <span class="live off" id="auto" title="ক্লিক করলে এখনই raw data মিলিয়ে টিক দেবে" style="cursor:pointer"><i></i><span id="autoTxt">Auto-tick…</span></span>
  </div>

  <div class="bar">
    <select id="sheetSel" aria-label="Sheet"></select>
    <input type="month" id="month" aria-label="Month">
    <select id="mode" aria-label="Sync mode">
      <option value="fill">Fill: বাকি টিক যোগ</option>
      <option value="exact">Exact: হুবহু মেলাও</option>
    </select>
    <button class="btn b-sync" id="syncBtn">⚡ Raw data থেকে অটো মার্ক</button>
    <button class="btn b-lock" id="lockBtn" title="টিক ম্যানুয়ালি বদলাতে আগে আনলক করুন">🔒 Locked</button>
    <input type="search" id="q" placeholder="🔍 নাম / ID খুঁজুন" aria-label="Search">
    <span class="sp"></span>
    <button class="btn b-new" id="newBtn">➕ নতুন মাস</button>
    <button class="btn b-link" id="lnkBtn">🔗 Link</button>
    <button class="btn b-ghost" id="refBtn" title="রিফ্রেশ">⟳</button>
  </div>

  <div class="stats" id="stats"></div>
  <div id="content"><div class="loader"><div class="spin"></div>লোড হচ্ছে…</div></div>
</div>

<div class="modal" id="modal"><div class="mbox">
  <h3 id="mTitle"></h3>
  <div id="mBody"></div>
  <div class="mrow"><button class="btn b-ghost" id="mCancel">বাতিল</button><button class="btn b-sync" id="mOk">সেভ</button></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbzVZ2A42rIxh5UgpBPuHSlb2tJnwyp2eunQc3kcNeZ495bqUJTeMwT8ir6cMA_3HBHESw/exec';
const PER = 16, POLL_MS = 15000;
const PALETTE = ['#7c4dff','#e5195f','#1e6bff','#ff2fd0','#12a150','#ff8a00','#00a6c7','#9b27af'];
const SEC_GRAD = [['#7c4dff','#00b8f0'],['#ff4fa3','#ffb02e'],['#12c98a','#00a6c7'],['#ff7a45','#e5195f']];
let STATE = null, current = '', busy = 0, lastJson = '', lastDone = 0, pollN = 0;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- API ---------- */
function getKey(){
  let k = localStorage.getItem('qa_key');
  if (!k){ k = prompt('Passkey দিন:') || ''; if (k) localStorage.setItem('qa_key', k); }
  return k;
}
async function run(fn, ...args){
  const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ fn: fn, args: args, key: getKey() }) });
  const j = await r.json();
  if (!j.ok){
    if (j.error === 'Unauthorized'){ localStorage.removeItem('qa_key'); throw new Error('Passkey ভুল, রিফ্রেশ করে আবার দিন'); }
    throw new Error(j.error);
  }
  return j.data;
}
function toast(msg, ms=3000){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), ms);
}
function setLive(ok){
  $('#live').classList.toggle('off', !ok);
  $('#liveTxt').textContent = ok ? 'Live · ' + new Date().toLocaleTimeString('bn-BD', {hour:'2-digit', minute:'2-digit', second:'2-digit'}) : 'সংযোগ নেই';
}
function monthFromName(n){
  const M=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
  const s=n.toLowerCase(), y=s.match(/20\d{2}/); let m=0;
  M.forEach((x,i)=>{ if(s.indexOf(x)>-1) m=i+1; });
  return (y&&m)? y[0]+'-'+String(m).padStart(2,'0') : '';
}

/* ---------- লোড ---------- */
async function init(){
  try{
    const names = await run('getSheets');
    const sel = $('#sheetSel');
    sel.innerHTML = names.map(n => `<option>${esc(n)}</option>`).join('');
    sel.value = names[names.length-1];
    sel.onchange = () => load(sel.value);
    await load(sel.value);
    loadAuto();
    setInterval(poll, POLL_MS);
  }catch(e){ $('#content').innerHTML = '<div class="loader">⚠️ ' + esc(e.message) + '</div>'; setLive(false); }
}
async function refreshSheetList(keep){
  const names = await run('getSheets'), sel = $('#sheetSel');
  sel.innerHTML = names.map(n => `<option>${esc(n)}</option>`).join('');
  sel.value = names.indexOf(keep) > -1 ? keep : names[names.length - 1];
  return sel.value;
}
async function load(name, retried){
  current = name;
  $('#month').value = monthFromName(name) || new Date().toISOString().slice(0,7);
  $('#content').innerHTML = '<div class="loader"><div class="spin"></div>লোড হচ্ছে…</div>';
  try{
    STATE = await run('getData', name); lastJson = JSON.stringify(STATE);
    render(); setLive(true);
  }catch(e){
    if (!retried && /Sheet পাওয়া যায়নি/.test(e.message)){      // ট্যাবের নাম বদলে গেলে তালিকা নতুন করে এনে আবার চেষ্টা
      try{ const n = await refreshSheetList(name); return load(n, true); }catch(_){}
    }
    $('#content').innerHTML = '<div class="loader">⚠️ ' + esc(e.message) + '</div>'; setLive(false);
  }
}
async function poll(){            // Sheet-এ বদল (অটো টিক বা অন্য কেউ) নিজে থেকে এখানে আসবে
  if (busy || document.hidden || $('#modal').classList.contains('show') || !current) return;
  try{
    const d = await run('getData', current);
    setLive(true);
    if (busy) return;
    const j = JSON.stringify(d);
    if (j !== lastJson){
      const fresh = diffTicks(STATE, d);
      lastJson = j; STATE = d; const y = scrollY; render(); scrollTo(0, y);
      if (fresh.length){ flash(fresh); toast(`🆕 ${fresh.length}টি নতুন টিক অটো মার্ক হয়েছে`, 4500); }
    }
    if (++pollN % 4 === 0) loadAuto();
  }catch(e){ setLive(false); }
}
function diffTicks(a, b){
  const out = []; if (!a) return out;
  b.sections.forEach((s, si) => { const os = a.sections[si]; if (!os) return;
    s.agents.forEach((ag, ai) => { const o = os.agents.find(x => x.id === ag.id && x.name === ag.name); if (!o) return;
      ag.ticks.forEach((t, i) => { if (t && !o.ticks[i]) out.push([si, ai, i]); }); }); });
  return out;
}
function flash(list){
  list.forEach(([si, ai, i], n) => {
    const tr = document.querySelector(`tr[data-s="${si}"][data-a="${ai}"]`); if (!tr) return;
    const c = tr.querySelectorAll('.cb:not([data-live])')[i];
    setTimeout(() => { if (c){ c.classList.add('auto'); } }, 40 * n);
  });
  const first = list[0]; const tr = first && document.querySelector(`tr[data-s="${first[0]}"][data-a="${first[1]}"]`);
  if (tr) confetti(tr.getBoundingClientRect());
}
async function loadAuto(){
  try{
    const s = await run('getAutoStatus'), el = $('#auto');
    el.classList.toggle('off', s.on === false || !!s.err);
    $('#autoTxt').textContent = s.err ? 'Auto-tick: এরর' : s.on === false ? 'Auto-tick বন্ধ' :
      'Auto-tick ON' + (s.last ? ' · ' + new Date(s.last).toLocaleTimeString('bn-BD', {hour:'2-digit', minute:'2-digit'}) : '');
    el.title = s.err ? s.err : 'ক্লিক করলে এখনই raw data মিলিয়ে টিক দেবে';
  }catch(e){}
}
$('#auto').onclick = async () => {
  if (busy) return; busy++; toast('⏳ raw data মেলানো হচ্ছে…', 8000);
  try{
    const r = await run('autoSyncNow');
    if (r && r.error) throw new Error(r.error);
    await reloadSilent(); loadAuto();
    toast(r && r.changed ? `✅ ${r.changed} জনের নতুন টিক পড়েছে` : '✅ সব আপ-টু-ডেট');
  }catch(e){ toast('⚠️ ' + e.message, 5000); }
  busy--;
};

/* ---------- রেন্ডার ---------- */
const ndone = a => a.ticks.filter(Boolean).length;
const nlive = a => a.live.filter(Boolean).length;

function render(){
  const box = $('#content'); box.innerHTML = '';
  if (!STATE.sections.length){ box.innerHTML = '<div class="empty">এই শিটে কোনো সেকশন পাওয়া যায়নি</div>'; updateStats(); return; }
  STATE.sections.forEach((sec, si) => {
    const g = SEC_GRAD[si % SEC_GRAD.length];
    const div = document.createElement('div'); div.className = 'sec'; div.dataset.s = si;
    let head = '<tr class="g"><th class="id"></th><th class="nm"></th><th colspan="4"></th><th colspan="8">Audit 1 – 8</th><th class="gap"></th><th colspan="8">Audit 9 – 16</th><th colspan="3">Result</th><th colspan="4">Live call audit</th><th>Extra</th><th></th></tr>';
    head += '<tr><th class="id">ID</th><th class="nm">Agent Name</th><th>DOJ</th><th>Gender</th><th>Week</th><th>Target</th>';
    for (let i = 1; i <= PER; i++){ if (i === 9) head += '<th class="gap"></th>'; head += `<th>${i}</th>`; }
    head += '<th>Total</th><th>Left</th><th>Progress</th><th>1</th><th>2</th><th>3</th><th>4</th><th>Total</th><th></th></tr>';
    const widths = [100,200,118,66,98,48].concat(Array(8).fill(28), [10], Array(8).fill(28), [48,48,84], Array(4).fill(28), [48,66]);
    const colgroup = '<colgroup>' + widths.map(w => `<col style="width:${w}px">`).join('') + '</colgroup>';
    const tw = widths.reduce((x, y) => x + y, 0);
    div.innerHTML = `<div class="sec-h" style="--a:${g[0]};--b:${g[1]}"><h2>${esc(sec.name)}</h2><span class="chip" data-sc></span><span class="sp"></span><button class="btn" data-add="${si}">➕ এজেন্ট যোগ</button></div>
      <div class="scroll"><table style="width:${tw}px">${colgroup}<thead>${head}</thead><tbody></tbody></table></div>`;
    const tb = div.querySelector('tbody');
    sec.agents.forEach((a, ai) => {
      const col = PALETTE[(ai + si * 3) % PALETTE.length];
      const tr = document.createElement('tr'); tr.className = 'ag'; tr.dataset.s = si; tr.dataset.a = ai;
      tr.dataset.k = (a.id + ' ' + a.name).toLowerCase();
      const gcls = /^f/i.test(a.gender) ? 'f' : 'm';
      let h = `<td class="id"><div class="cell"><span class="t">${esc(a.id)}</span>${a.id ? `<button class="cp" data-copy="${esc(a.id)}" title="ID কপি">📋</button>` : ''}</div></td><td class="nm"><div class="cell"><span class="t">${a.name ? esc(a.name) : '<i style="opacity:.45;font-weight:400">নাম নেই</i>'}</span>${a.name ? `<button class="cp" data-copy="${esc(a.name)}" title="নাম কপি">📋</button>` : ''}</div></td>
        <td class="dim">${esc(a.doj) || '–'}</td><td>${a.gender ? `<span class="g ${gcls}">${esc(a.gender)}</span>` : '–'}</td><td class="dim">${esc(a.week) || '–'}</td><td class="num">${a.target}</td>`;
      for (let i = 0; i < PER; i++){
        if (i === 8) h += '<td class="gap"></td>';
        h += `<td><button class="cb ${a.ticks[i] ? 'on' : ''}" style="--col:${col}" data-i="${i}" aria-label="Audit ${i+1}"></button></td>`;
      }
      h += '<td class="num" data-done></td><td class="num left" data-left></td><td><div class="pb"><i></i></div></td>';
      for (let i = 0; i < 4; i++) h += `<td><button class="cb ${a.live[i] ? 'on' : ''}" style="--col:${col}" data-live="${i}" aria-label="Live ${i+1}"></button></td>`;
      h += `<td class="num ext" data-ext></td><td class="act"><button class="e" data-edit title="এডিট">✏️</button> <button class="d" data-del title="ডিলিট">🗑️</button></td>`;
      tr.innerHTML = h; tb.appendChild(tr);
      refreshRow(tr, true);
    });
    if (!sec.agents.length) tb.innerHTML = '<tr><td colspan="40" class="empty">কোনো এজেন্ট নেই</td></tr>';
    box.appendChild(div);
    updateSecChip(si);
  });
  filterRows(); updateStats();
}

function refreshRow(tr, skipStats){
  const si = +tr.dataset.s, a = STATE.sections[si].agents[+tr.dataset.a];
  const n = ndone(a), ex = nlive(a);
  tr.querySelector('[data-done]').textContent = n;
  tr.querySelector('[data-left]').textContent = Math.max(a.target - n, 0);
  tr.querySelector('[data-ext]').textContent = ex;
  tr.querySelector('.pb i').style.width = Math.min(n / a.target * 100, 100) + '%';
  tr.classList.toggle('done', n >= a.target);
  if (!skipStats){ updateSecChip(si); updateStats(); }
}
function updateSecChip(si){
  const sec = STATE.sections[si];
  const t = sec.agents.reduce((s, a) => s + ndone(a), 0), e = sec.agents.reduce((s, a) => s + nlive(a), 0);
  const tg = sec.agents.reduce((s, a) => s + a.target, 0);
  const el = document.querySelector(`.sec[data-s="${si}"] [data-sc]`);
  if (el) el.textContent = `${t} + ${e} extra = ${t + e} / ${tg}`;
}

function updateStats(){
  if (!STATE) return;
  let target = 0, done = 0, left = 0, extra = 0;
  STATE.sections.forEach(s => s.agents.forEach(a => { target += a.target; done += ndone(a); left += Math.max(a.target - ndone(a), 0); extra += nlive(a); }));
  const pct = target ? Math.min(done / target, 1) : 0;
  $('#stats').innerHTML = `
   <div class="stat" style="--g:linear-gradient(#7c4dff,#00b8f0)"><small>Total Target</small><b data-n="${target}">${target}</b></div>
   <div class="stat" style="--g:linear-gradient(#1fd6a0,#00b8f0)"><small>Completed</small><b data-n="${done}">${done}</b></div>
   <div class="stat" style="--g:linear-gradient(#ff4fa3,#ffb02e)"><small>Remaining</small><b data-n="${left}">${left}</b></div>
   <div class="stat" style="--g:linear-gradient(#ffb02e,#ff7a45)"><small>Extra / Live call</small><b data-n="${extra}">${extra}</b></div>
   <div class="stat" style="--g:linear-gradient(#7c4dff,#ff4fa3)"><small>Total incl. extra</small><b data-n="${done + extra}">${done + extra}</b></div>
   <div class="stat ring"><svg viewBox="0 0 100 100"><defs><linearGradient id="grad"><stop offset="0" stop-color="#ff4fa3"/><stop offset=".5" stop-color="#7c4dff"/><stop offset="1" stop-color="#1fd6a0"/></linearGradient></defs>
     <circle class="bg" cx="50" cy="50" r="42"/><circle class="fg" cx="50" cy="50" r="42" style="stroke-dashoffset:${264 * (1 - pct)}"/></svg>
     <div><small>Progress</small><b>${(pct * 100).toFixed(1)}%</b></div></div>`;
  document.querySelectorAll('.stat b[data-n]').forEach(b => countUp(b, +b.dataset.n));
  if (pct >= 1 && lastDone < 1) confetti({left: innerWidth / 2, top: 160, width: 0, height: 0});
  lastDone = pct;
}
function countUp(el, to){
  const from = +(window.__prev && window.__prev[el.previousElementSibling.textContent] || 0), t0 = performance.now();
  (function f(t){ const k = Math.min((t - t0) / 600, 1); el.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(f); else { (window.__prev = window.__prev || {})[el.previousElementSibling.textContent] = to; } })(t0);
}

/* ---------- কপি ---------- */
async function copyText(txt, btn){
  try{ await navigator.clipboard.writeText(txt); }
  catch(e){ const t = document.createElement('textarea'); t.value = txt; document.body.appendChild(t); t.select(); try{ document.execCommand('copy'); }catch(_){} t.remove(); }
  if (btn){ const o = btn.textContent; btn.textContent = '✅'; setTimeout(() => btn.textContent = o, 900); }
  toast('📋 কপি হয়েছে: ' + txt, 1800);
}

/* ---------- লক ---------- */
let locked = true, lockT = null;
function setLock(v, auto){
  locked = v;
  const b = $('#lockBtn');
  b.textContent = v ? '🔒 Locked' : '🔓 Unlocked';
  b.classList.toggle('open', !v);
  $('#content').classList.toggle('locked', v);
  clearTimeout(lockT);
  if (!v) armLock();
  if (auto) toast('🔒 কিছুক্ষণ কাজ না করায় আবার লক হয়েছে', 3000);
}
function armLock(){ clearTimeout(lockT); if (!locked) lockT = setTimeout(() => setLock(true, true), 180000); }   // ৩ মিনিট কাজ না করলে নিজে লক
$('#lockBtn').onclick = () => { setLock(!locked); toast(locked ? '🔒 লক হয়েছে' : '🔓 আনলক: এখন টিক বদলানো যাবে (৩ মিনিট কাজ না করলে আবার লক)', 3000); };
setLock(true);

/* ---------- খোঁজা ---------- */
function filterRows(){
  const q = $('#q').value.trim().toLowerCase();
  document.querySelectorAll('tr.ag').forEach(tr => { tr.style.display = (!q || tr.dataset.k.indexOf(q) > -1) ? '' : 'none'; });
}
$('#q').oninput = filterRows;

/* ---------- ক্লিক হ্যান্ডলার ---------- */
$('#content').addEventListener('click', e => {
  const cp = e.target.closest('[data-copy]');
  if (cp){ copyText(cp.dataset.copy, cp); return; }
  const addB = e.target.closest('[data-add]');
  if (addB) return openAgentModal('add', +addB.dataset.add);
  const tr = e.target.closest('tr.ag'); if (!tr) return;
  const si = +tr.dataset.s, ai = +tr.dataset.a, a = STATE.sections[si].agents[ai];
  if (e.target.closest('[data-edit]')) return openAgentModal('edit', si, a);
  if (e.target.closest('[data-del]')) return openDeleteModal(a);
  const b = e.target.closest('.cb'); if (!b) return;
  if (locked){ const L = $('#lockBtn'); L.classList.remove('shake'); void L.offsetWidth; L.classList.add('shake'); toast('🔒 ম্যানুয়াল টিকের জন্য উপরের লক বাটনে ক্লিক করে আগে আনলক করুন', 3500); return; }
  armLock();
  const live = b.dataset.live !== undefined, idx = live ? +b.dataset.live : +b.dataset.i;
  const arr = live ? a.live : a.ticks;
  arr[idx] = !arr[idx];
  b.classList.toggle('on', arr[idx]); b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');
  refreshRow(tr);
  lastJson = JSON.stringify(STATE);
  if (!live && arr[idx] && arr.every(Boolean)) confetti(b.getBoundingClientRect());
  busy++;
  run('setTick', current, a.row, idx, arr[idx], live).catch(err => {
    arr[idx] = !arr[idx]; b.classList.toggle('on', arr[idx]); refreshRow(tr); toast('⚠️ সেভ হয়নি: ' + err.message, 5000);
  }).finally(() => { busy--; });
});

/* ---------- মোডাল ---------- */
let modalOk = null;
function showModal(title, body, okText, okFn, danger){
  $('#mTitle').textContent = title; $('#mBody').innerHTML = body;
  const ok = $('#mOk'); ok.textContent = okText; ok.className = 'btn ' + (danger ? 'b-del' : 'b-sync');
  modalOk = okFn; $('#modal').classList.add('show');
  const f = $('#mBody input'); if (f) setTimeout(() => f.focus(), 50);
}
function closeModal(){ $('#modal').classList.remove('show'); modalOk = null; }
$('#mCancel').onclick = closeModal;
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
$('#mOk').onclick = async () => {
  if (!modalOk) return;
  const ok = $('#mOk'); ok.disabled = true;
  try{ await modalOk(); closeModal(); }catch(e){ toast('⚠️ ' + e.message, 5000); }
  ok.disabled = false;
};
addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); if (e.key === 'Enter' && $('#modal').classList.contains('show') && e.target.tagName === 'INPUT') $('#mOk').click(); });

function openAgentModal(mode, si, a){
  a = a || {id:'', name:'', doj:'', gender:'Male'};
  const body = `<label>Employee ID</label><input type="text" id="fId" value="${esc(a.id)}">
    <label>Agent Name</label><input type="text" id="fName" value="${esc(a.name)}">
    <label>DOJ (যেমন 16.04.2026)</label><input type="text" id="fDoj" value="${esc(a.doj)}">
    <label>Gender</label><select id="fGen"><option ${/^m/i.test(a.gender) ? 'selected' : ''}>Male</option><option ${/^f/i.test(a.gender) ? 'selected' : ''}>Female</option><option value="" ${!a.gender && mode === 'edit' ? 'selected' : ''}>(ফাঁকা)</option></select>`;
  showModal(mode === 'add' ? 'নতুন এজেন্ট যোগ' : 'এজেন্ট এডিট', body, 'সেভ', async () => {
    const p = { id: $('#fId').value, name: $('#fName').value, doj: $('#fDoj').value, gender: $('#fGen').value };
    busy++;
    try{
      if (mode === 'add') await run('addAgent', current, si, p); else await run('updateAgent', current, a.row, p);
      await reloadSilent(); toast(mode === 'add' ? '✅ এজেন্ট যোগ হয়েছে' : '✅ আপডেট হয়েছে');
    } finally { busy--; }
  });
}
function openDeleteModal(a){
  showModal('এজেন্ট ডিলিট', `<p style="margin:0;line-height:1.6">${esc(a.name || a.id)} (${esc(a.id)}) কে Google Sheet থেকে মুছে ফেলবেন? এটা ফেরানো যাবে না।</p>`, 'ডিলিট করুন', async () => {
    busy++;
    try{ await run('deleteAgent', current, a.row); await reloadSilent(); toast('🗑️ ডিলিট হয়েছে'); } finally { busy--; }
  }, true);
}
async function reloadSilent(){
  const y = scrollY; STATE = await run('getData', current); lastJson = JSON.stringify(STATE); render(); scrollTo(0, y); setLive(true);
}

/* ---------- অটো মার্ক ---------- */
$('#syncBtn').onclick = async () => {
  const b = $('#syncBtn'); b.disabled = true; b.textContent = '⏳ সিঙ্ক হচ্ছে…'; busy++;
  try{
    const before = STATE.sections.map(s => s.agents.map(a => a.ticks.slice()));
    const r = await run('syncFromRaw', current, $('#month').value, $('#mode').value);
    await reloadSilent();
    let n = 0;
    STATE.sections.forEach((s, si) => s.agents.forEach((a, ai) => {
      const tr = document.querySelector(`tr[data-s="${si}"][data-a="${ai}"]`); if (!tr) return;
      a.ticks.forEach((t, i) => { if (t && before[si] && before[si][ai] && !before[si][ai][i]) { const c = tr.querySelectorAll('.cb:not([data-live])')[i]; setTimeout(() => c && c.classList.add('auto'), 20 * n++); } });
    }));
    toast(`✅ ${r.rawRows}টি raw কল, ${r.matched} জন মিলেছে, ${r.changed} জনের টিক বদলেছে`, 4500);
    if (n) confetti($('#syncBtn').getBoundingClientRect());
  }catch(e){ toast('⚠️ ' + e.message, 6000); }
  busy--; b.disabled = false; b.textContent = '⚡ Raw data থেকে অটো মার্ক';
};

/* ---------- নতুন মাস ---------- */
$('#newBtn').onclick = () => {
  const M = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const cm = monthFromName(current), d = new Date();
  let y = cm ? +cm.slice(0,4) : d.getFullYear(), m = cm ? +cm.slice(5) : d.getMonth() + 1;
  m++; if (m > 12){ m = 1; y++; }
  showModal('নতুন মাসের শিট', `<label>শিটের নাম (বর্তমান শিটের কপি, সব টিক খালি)</label><input type="text" id="fNew" value="Active List ${M[m-1]} ${y}">`, 'তৈরি করুন', async () => {
    const name = $('#fNew').value.trim(); if (!name) throw new Error('নাম দিন');
    busy++;
    try{
      await run('createMonthSheet', current, name);
      const names = await run('getSheets');
      $('#sheetSel').innerHTML = names.map(n => `<option>${esc(n)}</option>`).join('');
      $('#sheetSel').value = name; await load(name);
      toast('🎉 নতুন শিট তৈরি: ' + name); confetti($('#newBtn').getBoundingClientRect());
    } finally { busy--; }
  });
};
$('#refBtn').onclick = async () => { try{ const n = await refreshSheetList(current); await load(n); }catch(e){ load(current); } };
$('#lnkBtn').onclick = async () => {
  try{ await navigator.clipboard.writeText(location.href); toast('🔗 Link copy হয়েছে'); }
  catch(e){ prompt('Link copy করুন:', location.href); }
};

/* ---------- কনফেটি ---------- */
const cv = $('#fx'), cx = cv.getContext('2d'); let parts = [];
function size(){ cv.width = innerWidth; cv.height = innerHeight; } size(); addEventListener('resize', size);
function confetti(r){
  if (matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const x = r.left + (r.width || 0) / 2, y = r.top + (r.height || 0) / 2, wasEmpty = !parts.length;
  const cols = PALETTE.concat(['#ffb02e', '#1fd6a0', '#00b8f0']);
  for (let i = 0; i < 80; i++) parts.push({x, y, vx: (Math.random() - .5) * 11, vy: -Math.random() * 11 - 3, g: .35, s: 4 + Math.random() * 5, c: cols[i % cols.length], r: Math.random() * 6, vr: (Math.random() - .5) * .4, l: 85});
  if (wasEmpty) tick();
}
function tick(){
  cx.clearRect(0, 0, cv.width, cv.height);
  parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += p.g; p.r += p.vr; p.l--; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.globalAlpha = Math.max(p.l / 85, 0); cx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6); cx.restore(); });
  parts = parts.filter(p => p.l > 0);
  if (parts.length) requestAnimationFrame(tick); else cx.clearRect(0, 0, cv.width, cv.height);
}

init();
</script>
</body>
